<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Chat List - Contesto</title>
  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, royalblue, cyan);
      min-height: 100vh;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      text-align: center;
      padding: 15px;
      background: rgba(0,0,50,0.6);
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      font-weight: bold;
      font-size: 20px;
    }

    .chat-list {
      width: 92%;
      max-width: 650px;
      margin-top: 20px;
      background: rgba(255,255,255,0.15);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(0,0,0,0.3);
    }

    .chat-item {
      padding: 12px 15px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: background 0.3s;
    }

    .chat-item:hover {
      background: rgba(255,255,255,0.25);
    }

    .chat-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .profile-pic {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      object-fit: cover;
      background: rgba(255,255,255,0.3);
    }

    .user-info {
      display: flex;
      flex-direction: column;
    }

    .user-name {
      font-weight: 600;
      font-size: 15px;
    }

    .last-message {
      font-size: 13px;
      opacity: 0.8;
      margin-top: 3px;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status {
      font-size: 12px;
      opacity: 0.85;
    }

    .loading {
      margin-top: 30px;
      font-size: 18px;
      text-align: center;
      opacity: 0.8;
    }

    @media (max-width: 480px) {
      .profile-pic {
        width: 40px;
        height: 40px;
      }
      .user-name {
        font-size: 14px;
      }
      .last-message {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <header>Admin Chats 💬</header>

  <div id="chatList" class="chat-list"></div>
  <div id="loading" class="loading">Loading chats...</div>

  <script>
    const chatListDiv = document.getElementById("chatList");
    const loadingDiv = document.getElementById("loading");

    function formatTime(dateString) {
      const now = new Date();
      const date = new Date(dateString);
      const diff = (now - date) / 1000; // seconds

      if (diff < 60) return "Just now";
      if (diff < 3600) return Math.floor(diff / 60) + " min ago";
      if (diff < 86400) return Math.floor(diff / 3600) + " hr ago";
      if (diff < 172800) return "Yesterday";

      // within the same week
      const daysDiff = Math.floor(diff / 86400);
      if (daysDiff < 7) {
        return date.toLocaleDateString("en-US", { weekday: "short" });
      }

      return date.toLocaleDateString("en-US", { month: "short", day: "numeric" });
    }

    async function loadChats() {
      try {
        const res = await fetch("https://contesto.onrender.com/api/chat/admin/chat-users");
        if (!res.ok) throw new Error("Failed to fetch users");
        const users = await res.json();

        loadingDiv.style.display = "none";
        chatListDiv.innerHTML = "";

        if (!users || users.length === 0) {
          chatListDiv.innerHTML = `<p style="text-align:center;padding:20px;">No active chats yet</p>`;
          return;
        }

        for (const u of users) {
          // Fetch user details to display name & profile picture
          let userData = null;
          try {
            const resUser = await fetch(`https://contesto.onrender.com/api/users/${u._id}`);
            if (resUser.ok) userData = await resUser.json();
          } catch (e) {
            console.warn("Couldn't fetch user profile:", e);
          }

          const username = userData?.username || "Unknown User";
          const photo = userData?.profilePicture || "https://cdn-icons-png.flaticon.com/512/149/149071.png";

          const div = document.createElement("div");
          div.className = "chat-item";
          div.innerHTML = `
            <div class="chat-left">
              <img src="${photo}" alt="Profile" class="profile-pic">
              <div class="user-info">
                <span class="user-name">${username}</span>
                <span class="last-message">${u.lastMessage || "No messages yet"}</span>
              </div>
            </div>
            <div class="status">🕒 ${formatTime(u.lastActive)}</div>
          `;

          div.onclick = () => {
            const params = new URLSearchParams({ userId: u._id, room: u.room });
            window.location.href = `admin-chat.html?${params.toString()}`;
          };

          chatListDiv.appendChild(div);
        }

      } catch (err) {
        console.error(err);
        loadingDiv.textContent = "Failed to load chat list. Please try again.";
      }
    }

    loadChats();
  </script>
</body>
</html>
