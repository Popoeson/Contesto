<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Chat List - Contesto</title>
  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, royalblue, cyan);
      min-height: 100vh;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      text-align: center;
      padding: 15px;
      background: rgba(0,0,50,0.6);
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      font-weight: bold;
      font-size: 20px;
    }

    .chat-list {
      width: 92%;
      max-width: 650px;
      margin-top: 20px;
      background: rgba(255,255,255,0.15);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(0,0,0,0.3);
    }

    .chat-item {
      padding: 15px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: background 0.3s;
    }

    .chat-item:hover {
      background: rgba(255,255,255,0.2);
    }

    .user-info {
      display: flex;
      flex-direction: column;
    }

    .user-name {
      font-weight: bold;
      font-size: 16px;
    }

    .last-message {
      font-size: 13px;
      opacity: 0.8;
      margin-top: 4px;
    }

    .status {
      font-size: 12px;
      opacity: 0.9;
    }

    .loading {
      margin-top: 30px;
      font-size: 18px;
      text-align: center;
      opacity: 0.8;
    }

    @media (max-width: 480px) {
      .chat-item {
        padding: 12px;
      }
      .user-name {
        font-size: 14px;
      }
      .last-message {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <header>Admin Chats 💬</header>

  <div id="chatList" class="chat-list"></div>
  <div id="loading" class="loading">Loading chats...</div>

  <script>
  const chatListDiv = document.getElementById("chatList");
  const loadingDiv = document.getElementById("loading");

  async function loadChats() {
    try {
      // ✅ Use the correct backend route
      const res = await fetch("https://contesto.onrender.com/api/chat/admin/chat-users");
      if (!res.ok) throw new Error("Failed to fetch users");
      const users = await res.json();

      loadingDiv.style.display = "none";

      if (!users || users.length === 0) {
        chatListDiv.innerHTML = `<p style="text-align:center;padding:20px;">No active chats yet</p>`;
        return;
      }

      // ✅ Clear previous list
      chatListDiv.innerHTML = "";

      users.forEach(u => {
        // The backend aggregation returns:
        // _id (userId), lastMessage, room, lastActive
        const div = document.createElement("div");
        div.className = "chat-item";
        div.innerHTML = `
          <div class="user-info">
            <span class="user-name">User ID: ${u._id}</span>
            <span class="last-message">${u.lastMessage || "No messages yet"}</span>
          </div>
          <div>
            <span class="status">🕒 ${new Date(u.lastActive).toLocaleString()}</span>
          </div>
        `;

        // ✅ When clicked, open the chat page
        div.onclick = () => {
          const params = new URLSearchParams({
            userId: u._id,
            room: u.room
          });
          window.location.href = `admin-chat.html?${params.toString()}`;
        };

        chatListDiv.appendChild(div);
      });

    } catch (err) {
      console.error(err);
      loadingDiv.textContent = "Failed to load chat list. Please try again.";
    }
  }

  loadChats();
</script>
</body>
</html>
