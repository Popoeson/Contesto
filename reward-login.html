
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Contesto</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom right, #003366, #005f99);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #ffffff;
    }

    .form-box {
      width: 100%;
      max-width: 400px;
      background: rgba(255, 255, 255, 0.05);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.4);
      text-align: center;
      position: relative;
      transition: filter 0.3s ease;
    }

    .form-box.blur {
      filter: blur(2px);
    }

    .logo-section {
      margin-bottom: 20px;
    }

    .logo {
      width: 80px;
      height: auto;
    }

    .slogan {
      margin-top: 10px;
      font-size: 14px;
      color: #ffdd57;
    }

    .form-title {
      margin-bottom: 20px;
      font-size: 22px;
      color: #00ffaa;
    }

    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }

    .input-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .input-group input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      outline: none;
      background-color: rgba(255, 255, 255, 0.1);
      color: white;
    }

    #togglePassword {
      display: block;
      text-align: right;
      font-size: 12px;
      margin-top: 5px;
      color: #ffd700;
      cursor: pointer;
    }

    button {
      margin-top: 10px;
      width: 100%;
      padding: 12px;
      background-color: #00aaff;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s ease;
      position: relative;
    }

    button:hover {
      background-color: #008ecc;
    }

    /* Loader Overlay */
    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      display: none;
    }

    .spinner {
      border: 8px solid rgba(255, 255, 255, 0.2);
      border-top: 8px solid #00aaff;
      border-radius: 50%;
      width: 70px;
      height: 70px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .error {
      margin-top: 12px;
      font-size: 14px;
      color: #ff7070;
    }
  </style>
</head>
<body>
  <div class="form-box" id="formBox">
    <div class="logo-section">
      <img src="uploads/logo.png" alt="Site Logo" class="logo">
      <h2 class="slogan">Where Humor Meets Rewards</h2>
    </div>
    <h2 class="form-title">Welcome Back</h2>
    <form id="loginForm">
      <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" required>
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" required>
        <small id="togglePassword">Show Password</small>
      </div>
      <button type="submit" id="loginBtn">Login</button>
      <div id="errorMsg" class="error"></div>
    </form>
  </div>

  <!-- Loader Overlay -->
  <div class="overlay" id="overlay">
    <div class="spinner"></div>
  </div>

  <script>
  const toggle = document.getElementById('togglePassword');
  const password = document.getElementById('password');
  const loginForm = document.getElementById('loginForm');
  const loginBtn = document.getElementById('loginBtn');
  const overlay = document.getElementById('overlay'); // ✅ fixed
  const spinner = document.querySelector('.spinner');
  const errorMsg = document.getElementById('errorMsg');
  const formBox = document.getElementById('formBox');

  toggle.addEventListener('click', () => {
    const isHidden = password.type === 'password';
    password.type = isHidden ? 'text' : 'password';
    toggle.textContent = isHidden ? 'Hide Password' : 'Show Password';
  });

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    overlay.style.display = 'flex'; // Show overlay when submitting
    spinner.style.display = 'flex';
    formBox.classList.add('blur');
    errorMsg.textContent = '';

    const username = document.getElementById('username').value.trim();
    const passwordVal = password.value.trim();

    try {
      const res = await fetch('https://contesto.onrender.com/api/users/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password: passwordVal })
      });

      const data = await res.json();

      if (res.ok) {
  localStorage.removeItem('user'); // ✅ clear old user
  localStorage.setItem('user', JSON.stringify(data.user));
  
  overlay.style.display = 'none';
  spinner.style.display = 'none';
  formBox.classList.remove('blur');

  window.location.href = 'contestants-home.html';
    }
      } else {
        throw new Error(data.message || 'Login failed');
      }
    } catch (err) {
      errorMsg.textContent = err.message;
      loginBtn.disabled = false;
      overlay.style.display = 'none';
      spinner.style.display = 'none';
      formBox.classList.remove('blur');
    }
  });
  </script>
</body>
  </html>
