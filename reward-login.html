<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contestant Login</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to bottom right, #0044cc, #00c2ff);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      color: white;
    }

    .container {
      background-color: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 40px 30px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
    }

    h2 {
      margin-bottom: 20px;
      font-size: 24px;
      color: #fff000;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      background-color: #ff4444;
      color: white;
      border: none;
      padding: 14px;
      width: 100%;
      font-size: 16px;
      border-radius: 30px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #cc0000;
    }

    .spinner {
      display: none;
      margin-top: 20px;
    }

    .spinner div {
      width: 16px;
      height: 16px;
      background-color: #fff000;
      border-radius: 100%;
      display: inline-block;
      animation: bouncedelay 1.4s infinite ease-in-out both;
    }

    .spinner div:nth-child(1) {
      animation-delay: -0.32s;
    }

    .spinner div:nth-child(2) {
      animation-delay: -0.16s;
    }

    @keyframes bouncedelay {
      0%, 80%, 100% {
        transform: scale(0);
      }
      40% {
        transform: scale(1);
      }
    }

    .error {
      color: #ffdddd;
      font-size: 14px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Contestant Login</h2>
    <input type="text" id="username" placeholder="Enter username" />
    <input type="password" id="password" placeholder="Enter password" />
    <button onclick="handleLogin()">Login</button>
    
    <div class="spinner" id="spinner">
      <div></div>
      <div></div>
      <div></div>
    </div>
    
    <div class="error" id="error"></div>
  </div>

  <script>
    async function handleLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorDiv = document.getElementById('error');
      const spinner = document.getElementById('spinner');

      if (!username || !password) {
        errorDiv.textContent = 'Please enter both username and password.';
        return;
      }

      errorDiv.textContent = '';
      spinner.style.display = 'block';

      try {
        const res = await fetch('https://contesto.onrender.com/api/contestants/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('contestantUsername', username);
          window.location.href = 'contestant-home.html';
        } else {
          spinner.style.display = 'none';
          errorDiv.textContent = data.error || 'Login failed. Try again.';
        }
      } catch (err) {
        spinner.style.display = 'none';
        errorDiv.textContent = 'Network error. Try again.';
      }
    }
  </script>
</body>
</html>
