<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>🏆 Contesto — Leaderboard</title>

<!-- socket.io client CDN -->
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js" defer></script>

<style>
  :root{
    --bg1: #001f3f;
    --bg2: #0074D9;
    --card-bg: rgba(255,255,255,0.06);
    --accent: #ffcc00;
    --text: #ffffff;
    --muted: #cdd6e0;
    --shadow: 0 10px 30px rgba(0,0,0,0.45);
  }

  html,body{
    height:100%;
    margin:0;
    font-family: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    background: linear-gradient(135deg, var(--bg1), #105aee 55%, #00d4ff);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px;
    box-sizing:border-box;
  }

  .wrap{
    width:100%;
    max-width:1000px;
    background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
    border-radius:16px;
    padding:20px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(6px);
    overflow:hidden;
  }

  header{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:14px;
  }

  header h1{
    margin:0;
    font-size:20px;
    letter-spacing:0.2px;
    display:flex;
    align-items:center;
    gap:10px;
  }

  .shine {
    display:inline-block;
    padding:6px 12px;
    border-radius:12px;
    background: linear-gradient(90deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    box-shadow: 0 4px 14px rgba(0,0,0,0.25) inset;
    color:var(--muted);
    font-size:13px;
  }

  /* Leaderboard list area */
  .leaderboard {
    position:relative;
    margin-top:12px;
  }

  .list {
    display:flex;
    flex-direction:column;
    gap:10px;
    position:relative;
  }

  .row {
    display:grid;
    grid-template-columns: 56px 1fr 130px;
    gap:12px;
    align-items:center;
    padding:12px;
    border-radius:10px;
    background: var(--card-bg);
    transition: transform 420ms cubic-bezier(.2,.9,.2,1), box-shadow 300ms;
    will-change: transform;
    box-shadow: 0 6px 18px rgba(0,0,0,0.25);
    overflow:hidden;
  }

  /* Rank column */
  .rank {
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    font-weight:700;
    color:var(--muted);
    min-width:56px;
    height:56px;
    border-radius:8px;
  }

  .medal {
    font-size:18px;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.6));
  }

  .medal.gold { color: #FFD700; }
  .medal.silver { color: #C0C0C0; }
  .medal.bronze { color: #CD7F32; }

  /* avatar + name */
  .identity {
    display:flex;
    gap:12px;
    align-items:center;
  }

  .avatar {
    width:56px;height:56px;border-radius:12px;flex:0 0 56px;
    background:linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
    border:2px solid rgba(255,255,255,0.06);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .avatar img{width:100%;height:100%;object-fit:cover;border-radius:10px;}

  .meta {
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .username {
    font-weight:700;
    font-size:15px;
    color:var(--text);
  }
  .sub {
    font-size:13px;color:var(--muted);
  }

  /* votes */
  .votes {
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:12px;
    padding-left:8px;
  }

  .vote-count {
    font-weight:900;
    font-size:20px;
    color:var(--accent);
    min-width:60px;
    text-align:right;
    transition: transform 400ms cubic-bezier(.2,.9,.2,1), color 300ms;
  }

  /* bounce / glow effect when value increases */
  .pop {
    animation: pop 700ms ease;
    text-shadow: 0 6px 18px rgba(0,0,0,0.5);
  }
  @keyframes pop {
    0% { transform: translateY(6px) scale(0.9); color: #fff; filter: drop-shadow(0 0 0 rgba(0,0,0,0)); }
    40% { transform: translateY(-8px) scale(1.08); color: #fff; text-shadow:0 6px 18px rgba(0,0,0,0.6); }
    100% { transform: translateY(0) scale(1); color: var(--accent); }
  }

  /* highlight when rank increased */
  .rise {
    box-shadow: 0 12px 34px rgba(255,220,100,0.12);
    border: 1px solid rgba(255,220,100,0.12);
    transform: translateY(-6px);
  }

  /* small confetti-like burst (simple) */
  .confetti {
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:0;
    transition:opacity 300ms;
  }

  .confetti.show { opacity:1; }

  /* responsive */
  @media (max-width:700px){
    .row { grid-template-columns: 48px 1fr 90px; padding:10px; }
    .avatar, .rank { width:48px;height:48px; }
    .vote-count { font-size:18px; min-width:50px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>🏆 Leaderboard</h1>
      <div class="shine">Real-time • Animated</div>
    </header>

    <div class="leaderboard">
      <div id="list" class="list" aria-live="polite"></div>
      <div id="confetti" class="confetti"></div>
    </div>
  </div>

<script>
(() => {
  const API_BASE = location.origin.replace(/\/+$/, '') || ''; // use same host as page if not provided
  const SOCKET_URL = API_BASE; // adjust if socket on different origin
  const listEl = document.getElementById('list');
  const confettiEl = document.getElementById('confetti');

  // previous state tracking
  let prevData = []; // array of user objects
  let elementsById = new Map(); // userId => DOM element

  // helper: build a row DOM element
  function buildRow(user, index) {
    const row = document.createElement('div');
    row.className = 'row';
    row.dataset.userId = user.userId || user._id || user.id || user.username;

    // rank cell
    const rank = document.createElement('div');
    rank.className = 'rank';
    // medal for top3
    if (index === 0) rank.innerHTML = `<span class="medal gold">🥇</span>`;
    else if (index === 1) rank.innerHTML = `<span class="medal silver">🥈</span>`;
    else if (index === 2) rank.innerHTML = `<span class="medal bronze">🥉</span>`;
    else rank.textContent = index + 1;

    // identity
    const identity = document.createElement('div');
    identity.className = 'identity';

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    const img = document.createElement('img');
    img.src = user.profilePicture || `https://via.placeholder.com/150?text=${encodeURIComponent((user.username || 'U')[0]||'U')}`;
    img.alt = user.username || 'User';
    avatar.appendChild(img);

    const meta = document.createElement('div');
    meta.className = 'meta';
    const uname = document.createElement('div');
    uname.className = 'username';
    uname.textContent = user.username || 'Unknown';
    const sub = document.createElement('div');
    sub.className = 'sub';
    sub.textContent = `${(user.totalVotes || 0)} votes`;

    meta.appendChild(uname);
    meta.appendChild(sub);

    identity.appendChild(avatar);
    identity.appendChild(meta);

    // votes
    const votes = document.createElement('div');
    votes.className = 'votes';
    const voteCount = document.createElement('div');
    voteCount.className = 'vote-count';
    voteCount.textContent = user.totalVotes || 0;

    votes.appendChild(voteCount);

    row.appendChild(rank);
    row.appendChild(identity);
    row.appendChild(votes);

    return row;
  }

  // compute map by userId for quick lookup
  function idxById(arr){
    const m = new Map();
    arr.forEach((u,i) => m.set(String(u.userId||u._id||u.id||u.username), {user:u, index:i}));
    return m;
  }

  // FLIP animation helper: reorder DOM with smooth moves
  function flipReorder(newArray) {
    const oldRects = new Map();
    // record old positions
    document.querySelectorAll('.row').forEach(el => {
      oldRects.set(el.dataset.userId, el.getBoundingClientRect());
    });

    // create new DOM fragment in correct order
    const frag = document.createDocumentFragment();
    newArray.forEach((user, idx) => {
      let el = elementsById.get(String(user.userId||user._id||user.id||user.username));
      if (!el) {
        el = buildRow(user, idx);
        elementsById.set(String(user.userId||user._id||user.id||user.username), el);
      } else {
        // update rank medal or number
        const rankCell = el.querySelector('.rank');
        if (rankCell) {
          if (idx === 0) rankCell.innerHTML = `<span class="medal gold">🥇</span>`;
          else if (idx === 1) rankCell.innerHTML = `<span class="medal silver">🥈</span>`;
          else if (idx === 2) rankCell.innerHTML = `<span class="medal bronze">🥉</span>`;
          else rankCell.textContent = idx + 1;
        }
        // update text fields (username & votes)
        const uname = el.querySelector('.username');
        if (uname) uname.textContent = user.username || 'Unknown';
        const sub = el.querySelector('.sub');
        if (sub) sub.textContent = `${(user.totalVotes||0)} votes`;
        const vc = el.querySelector('.vote-count');
        if (vc) vc.textContent = user.totalVotes || 0;
      }
      frag.appendChild(el);
    });

    // append in new order but don't let browser repaint before measuring
    const firstChildBefore = listEl.firstElementChild;
    listEl.appendChild(frag);

    // measure new positions and apply transforms
    const newRects = new Map();
    document.querySelectorAll('.row').forEach(el => {
      newRects.set(el.dataset.userId, el.getBoundingClientRect());
    });

    // apply inverse transforms (from old to new)
    newRects.forEach((newRect, id) => {
      const el = elementsById.get(id);
      const oldRect = oldRects.get(id);
      if (!oldRect) {
        // new element, animate entrance
        el.style.transform = 'translateY(12px) scale(0.98)';
        el.style.opacity = '0';
        requestAnimationFrame(() => {
          el.style.transition = 'transform 600ms cubic-bezier(.2,.9,.2,1), opacity 350ms';
          el.style.transform = 'translateY(0) scale(1)';
          el.style.opacity = '1';
          setTimeout(()=> el.style.transition = '', 700);
        });
        return;
      }
      const dy = oldRect.top - newRect.top;
      const dx = oldRect.left - newRect.left;
      if (dy || dx) {
        el.style.transition = 'none';
        el.style.transform = `translate(${dx}px, ${dy}px)`;
        // force repaint
        el.getBoundingClientRect();
        // animate to identity
        requestAnimationFrame(() => {
          el.style.transition = 'transform 600ms cubic-bezier(.2,.9,.2,1)';
          el.style.transform = '';
          // cleanup after
          setTimeout(()=> el.style.transition = '', 650);
        });
      }
    });
  }

  // apply visual "pop" for users whose counts increased & "rise" highlight for movers
  function animateChanges(prev, next) {
    const prevMap = idxById(prev);
    const nextMap = idxById(next);

    next.forEach((u, newIndex) => {
      const id = String(u.userId||u._id||u.id||u.username);
      const el = elementsById.get(id);
      if (!el) return;
      const vc = el.querySelector('.vote-count');

      const prevEntry = prevMap.get(id);
      const prevVotes = prevEntry ? (prevEntry.user.totalVotes || 0) : 0;
      const newVotes = u.totalVotes || 0;

      // Pop if votes increased
      if (newVotes > prevVotes) {
        vc.classList.add('pop');
        // short rise highlight
        el.classList.add('rise');
        setTimeout(() => vc.classList.remove('pop'), 800);
        setTimeout(() => el.classList.remove('rise'), 900);

        // small confetti for top-1 promotion
        const prevRank = prevEntry ? prevEntry.index : Infinity;
        if (newIndex === 0 && prevRank !== 0) {
          // show simple confetti flash
          confettiEl.classList.add('show');
          setTimeout(()=> confettiEl.classList.remove('show'), 900);
        }
      }
    });
  }

  // initial render (empty)
  function initialRender(array) {
    listEl.innerHTML = '';
    elementsById.clear();
    array.forEach((user, idx) => {
      const el = buildRow(user, idx);
      elementsById.set(String(user.userId||user._id||user.id||user.username), el);
      listEl.appendChild(el);
    });
    prevData = array.slice();
  }

  // core update: animate reordering & changes
  function updateLeaderboard(newArray) {
    // ensure sorted by totalVotes desc
    newArray.sort((a,b) => (b.totalVotes||0) - (a.totalVotes||0));

    // animate differences
    animateChanges(prevData, newArray);

    // reorder with FLIP
    flipReorder(newArray);

    // save for next diff
    prevData = newArray.map(u => ({ ...u })); // shallow copy
  }

  // fetch fallback
  async function fetchLeaderboard() {
    try {
      const res = await fetch(`${API_BASE}/api/leaderboard`);
      if (!res.ok) throw new Error('Failed to fetch leaderboard');
      const data = await res.json();
      return data;
    } catch (err) {
      console.error('Leaderboard fetch error', err);
      return [];
    }
  }

  // connect socket & mount
  async function mount() {
    const initial = await fetchLeaderboard();
    if (!initial || !initial.length) {
      // show empty state
      listEl.innerHTML = '<div class="empty" style="padding:16px;text-align:center;color:var(--muted)">No leaderboard data yet</div>';
    } else {
      initialRender(initial);
    }

    // socket.io connect (use global io from client CDN)
    try {
      const socket = io(SOCKET_URL, { transports: ['websocket', 'polling'] });

      socket.on('connect', ()=> {
        console.log('Leaderboard socket connected', socket.id);
      });

      socket.on('leaderboard_update', (payload) => {
        // payload expected as array of { userId, username, profilePicture, totalVotes }
        if (!Array.isArray(payload)) return;
        updateLeaderboard(payload);
      });

      socket.on('disconnect', ()=> {
        console.warn('Leaderboard socket disconnected');
      });

      // optionally request initial scoreboard push
      socket.emit('request_leaderboard');
    } catch (err) {
      console.warn('Socket connection failed — continuing with periodic fetch fallback', err);
      // fallback: poll every 6s
      setInterval(async ()=> {
        const next = await fetchLeaderboard();
        if (next && next.length) updateLeaderboard(next);
      }, 6000);
    }
  }

  // small visual confetti content (CSS-only simple)
  confettiEl.innerHTML = `
    <svg width="100%" height="100%" viewBox="0 0 600 120" preserveAspectRatio="none">
      <g opacity="0.9">
        <circle cx="60" cy="20" r="4" fill="#ffd700"/><rect x="100" y="10" width="6" height="6" rx="1" fill="#ff7a7a"/>
        <circle cx="170" cy="10" r="3" fill="#7afcff"/><rect x="230" y="18" width="5" height="5" rx="1" fill="#ffd700"/>
        <circle cx="340" cy="20" r="4" fill="#ff7a7a"/><rect x="420" y="12" width="6" height="6" rx="1" fill="#7afcff"/>
      </g>
    </svg>
  `;

  mount();
})();
</script>
</body>
</html>
