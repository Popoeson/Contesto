<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin - Pick Winner | Contesto</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, royalblue, cyan);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
      min-height: 100vh;
      box-sizing: border-box;
      transition: filter 0.3s ease;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 700px;
      margin-bottom: 20px;
    }

    header a {
      text-decoration: none;
      color: #fff;
      font-size: 24px;
      background-color: rgba(0, 0, 50, 0.5);
      padding: 8px 12px;
      border-radius: 10px;
      transition: background 0.3s;
    }

    header a:hover {
      background-color: rgba(0, 0, 80, 0.8);
    }

    header h1 {
      flex: 1;
      text-align: center;
      font-size: 20px;
      margin: 0;
    }

    #pickWinnerBtn {
      background: gold;
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      padding: 8px 14px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    #pickWinnerBtn:hover {
      transform: scale(1.05);
      background: #ffdf00;
    }

    .meme-preview {
      background-color: rgba(0, 0, 50, 0.7);
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 0 10px #000;
      width: 100%;
      max-width: 700px;
      text-align: center;
      margin-bottom: 25px;
    }

    .meme-preview img {
      width: 100%;
      border-radius: 10px;
      border: 2px solid #fff;
      object-fit: contain;
      max-height: 350px;
    }

    .caption-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 700px;
    }

    .caption-card {
      background-color: rgba(0, 0, 50, 0.6);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      box-shadow: 0 0 6px #000;
    }

    .caption-card img {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #fff;
    }

    .caption-info {
      flex: 1;
    }

    .caption-info h3 {
      margin: 0;
      font-size: 15px;
      color: #ffcc00;
    }

    .caption-info p {
      margin: 5px 0;
      font-size: 14px;
      word-break: break-word;
    }

    .time {
      font-size: 12px;
      color: #ccc;
      margin-top: 3px;
    }

    .empty {
      text-align: center;
      color: #eee;
      margin-top: 20px;
      font-style: italic;
    }

    /* Spinner overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      flex-direction: column;
    }

    .spinner {
      border: 5px solid #f3f3f3;
      border-top: 5px solid gold;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Winner popup */
    .winner-popup {
      text-align: center;
      background: rgba(0,0,50,0.8);
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 0 20px gold;
      color: #fff;
      animation: pop 0.6s ease-out;
      max-width: 90%;
    }

    @keyframes pop {
      0% { transform: scale(0.2); opacity: 0; }
      60% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1); }
    }

    .winner-popup img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 3px solid gold;
      margin-bottom: 10px;
    }

    .winner-popup h2 {
      color: gold;
      margin: 5px 0;
    }

    .winner-popup p {
      font-size: 14px;
      color: #eee;
    }

    .done-btn {
      background: gold;
      color: #000;
      border: none;
      padding: 8px 16px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }

    .done-btn:hover {
      background: #ffdf00;
      transform: scale(1.05);
    }

    @media (max-width: 500px) {
      header h1 { font-size: 18px; }
      #pickWinnerBtn { padding: 6px 10px; font-size: 14px; }
    }
  </style>
</head>
<body>
  <header>
    <a href="contestants-home.html">🏠</a>
    <h1>💬 Admin - All Captions</h1>
    <button id="pickWinnerBtn">🎉 Pick Winner</button>
  </header>

  <div class="meme-preview" id="memeContainer">
    <p>Loading meme...</p>
  </div>

  <div class="caption-list" id="captionList">
    <p class="empty">Loading captions...</p>
  </div>

  <!-- Spinner overlay -->
  <div class="overlay" id="overlay">
    <div class="spinner"></div>
  </div>

  <script>
    const API_BASE_URL = "https://contesto.onrender.com";
    let captions = [];
    let currentMeme = null;

    function timeAgo(date) {
      const seconds = Math.floor((new Date() - new Date(date)) / 1000);
      const intervals = { year: 31536000, month: 2592000, week: 604800, day: 86400, hour: 3600, minute: 60 };
      for (let key in intervals) {
        const value = Math.floor(seconds / intervals[key]);
        if (value >= 1) return `${value}${key[0]} ago`;
      }
      return "Just now";
    }

    async function loadMeme() {
      const container = document.getElementById("memeContainer");
      try {
        const res = await fetch(`${API_BASE_URL}/api/memes/latest`);
        currentMeme = await res.json();
        if (currentMeme && currentMeme.imageUrl) {
          container.innerHTML = `<img src="${currentMeme.imageUrl}" alt="Latest Meme">`;
        } else {
          container.innerHTML = `<p>No meme available yet.</p>`;
        }
      } catch {
        container.innerHTML = `<p>Failed to load meme.</p>`;
      }
    }

    async function loadCaptions() {
      const list = document.getElementById("captionList");
      try {
        const res = await fetch(`${API_BASE_URL}/api/caption-check`);
        captions = await res.json();

        if (!captions.length) {
          list.innerHTML = `<p class="empty">No captions yet.</p>`;
          return;
        }

        list.innerHTML = captions.map(c => {
          const username = c.username || "Unknown";
          const profilePic = c.profilePicture || `https://via.placeholder.com/100?text=${encodeURIComponent(username[0] || 'U')}`;
          const captionText = c.caption || "";
          const time = c.createdAt ? timeAgo(c.createdAt) : "";
          return `
            <div class="caption-card">
              <img src="${profilePic}" alt="N/A">
              <div class="caption-info">
                <h3>${username}</h3>
                <p>${captionText}</p>
                <div class="time">${time}</div>
              </div>
            </div>
          `;
        }).join('');
      } catch {
        list.innerHTML = `<p class="empty">Failed to load captions.</p>`;
      }
    }

    document.getElementById("pickWinnerBtn").addEventListener("click", () => {
      if (!captions.length) return alert("No captions to pick from!");

      const overlay = document.getElementById("overlay");
      document.body.style.filter = "blur(4px)";
      overlay.style.display = "flex";
      overlay.innerHTML = `<div class="spinner"></div>`;

      setTimeout(() => {
        const randomIndex = Math.floor(Math.random() * captions.length);
        const winner = captions[randomIndex];

        overlay.innerHTML = `
          <div class="winner-popup">
            <img src="${winner.profilePicture || `https://via.placeholder.com/100?text=${encodeURIComponent(winner.username[0] || 'U')}`}" alt="Winner">
            <h2>🏆 ${winner.username}</h2>
            <p>"${winner.caption}"</p>
            <p style="color:gold;">🎉 Congratulations! 🎉</p>
            <button class="done-btn" id="saveWinnerBtn">Done</button>
          </div>
        `;

        document.body.style.filter = "blur(0)";

        // ✅ Handle saving winner
        document.getElementById("saveWinnerBtn").addEventListener("click", async () => {
          try {
            const saveRes = await fetch(`${API_BASE_URL}/api/winner/save`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                username: winner.username,
                caption: winner.caption,
                meme: currentMeme?.imageUrl || "",
                profilePicture: winner.profilePicture || ""
              })
            });

            const result = await saveRes.json();

            if (saveRes.ok) {
              alert("Winner saved successfully!");
            } else {
              alert(result.message || "Failed to save winner.");
            }
          } catch (err) {
            console.error(err);
            alert("Error saving winner.");
          }

          // Clear overlay and return to caption view
          overlay.style.display = "none";
          document.body.style.filter = "blur(0)";
        });
      }, 3000);
    });

    loadMeme();
    loadCaptions();
  </script>
</body>
  </html>
