<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contestant Homepage</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to bottom right, #0044cc, #00c2ff);
      min-height: 100vh;
      color: white;
      overflow-x: hidden;
    }

    .logo-section {
      text-align: center;
    }

    .logo {
      width: 30px;
      height: 30px;
      border-radius: 20px;
    }
    

    /* Sidebar (hidden by default) */
    .sidebar {
      position: fixed;
      top: 0;
      left: -300px; /* completely off-screen by default */
      width: 250px;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(6px);
      padding: 20px;
      box-shadow: 2px 0 8px rgba(0,0,0,0.4);
      transition: left 0.3s ease-in-out;
      display: flex;
      flex-direction: column;
      z-index: 1000;
    }

    .sidebar.active {
      left: 0; /* slides in when active */
    }

    .sidebar button {
      background: #ff4444;
      border: none;
      color: white;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease;
      font-size: 16px;
    }

    .sidebar button:hover {
      background: #cc0000;
    }

    .sidebar button.settings {
      background: #ffaa00;
    }

    .sidebar button.settings:hover {
      background: #cc8800;
    }

    /* Overlay */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      display: none;
      z-index: 900;
    }

    .overlay.active {
      display: block;
    }

    /* Top bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 20px;
    }

    .menu-btn {
      font-size: 28px;
      cursor: pointer;
      background: none;
      border: none;
      color: white;
    }

    /* Main Content */
    .main {
      padding: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 30px;
    }

    .header img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 3px solid #fff000;
      object-fit: cover;
    }

    .header h2 {
      margin: 0;
      font-size: 22px;
      color: #fff000;
    }

    /* Cards grid */
    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr); /* 2 per row by default */
      gap: 20px;
    }

    @media (min-width: 768px) {
      .cards {
        grid-template-columns: repeat(3, 1fr); /* 3 per row on tablets */
      }
    }

    @media (min-width: 1024px) {
      .cards {
        grid-template-columns: repeat(4, 1fr); /* 4 per row on desktop */
      }
    }

    .card {
      background: rgba(255, 255, 255, 0.1);
      padding: 30px 20px;
      border-radius: 16px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      background: rgba(255, 255, 255, 0.2);
    }

    footer {
      text-align: center;
      margin-top: 30px;
      font-size: 14px;
      color: #eee;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <button onclick="logout()">🚪 Sign Out</button>
    <button onclick="deleteAccount()">🗑 Delete Account</button>
    <button class="settings">⚙ Settings</button>
  </div>

  <!-- Overlay -->
  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

  <!-- Top bar -->
  <div class="top-bar">
    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    <div class="logo-section">
      <img src="uploads/logo.png" alt="Site Logo" class="logo">
    </div>
    
    <h2></h>
  </div>

  <!-- Main Section -->
  <div class="main">
    <!-- Profile + Welcome -->
    <div class="header">
      <img id="profilePic" src="images/default-avatar.png" alt="Profile Picture">
      <h2 id="welcomeNote">Welcome, Contestant</h2>
    </div>

    <!-- Cards -->
    <div class="cards">
      <div class="card">Contests</div>
      <div class="card">Winnings History</div>
      <div class="card">Results</div>
      <div class="card">Claims</div>
    </div>

    <footer>
      &copy; 2025 Contesto. All rights reserved.
    </footer>
  </div>

<script>
  // Sidebar toggle
  function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("active");
    document.getElementById("overlay").classList.toggle("active");
  }

  // Load user from localStorage
  const user = JSON.parse(localStorage.getItem("user"));

  if (user) {
    const profilePic = user.profilePic 
      ? `https://contesto.onrender.com${user.profilePic}`
      : "images/default-avatar.png";

    document.getElementById("profilePic").src = profilePic;
    document.getElementById("welcomeNote").textContent = `Welcome, ${user.fullName || user.username || "Contestant"}`;
  } else {
    window.location.href = "reward-login.html";
  }

  // Logout
  function logout() {
    localStorage.removeItem("user");
    window.location.href = "reward-login.html";
  }

  // Delete Account
  function deleteAccount() {
    if (confirm("Are you sure you want to delete your account? This action cannot be undone.")) {
      localStorage.removeItem("user");
      alert("Your account has been deleted.");
      window.location.href = "register.html";
    }
  }
</script>

</body>
        </html>
