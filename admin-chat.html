<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🏆 Admin Chat - Contesto</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
/* =============================
   🌟 Contesto Admin Chat Styles
   ============================= */
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, royalblue, cyan);
  color: #fff;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

header {
  background: rgba(0,0,50,0.6);
  padding: 15px;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
  color: #fff;
  position: relative;
  flex-shrink: 0;
}

header a {
  position: absolute;
  left: 15px;
  top: 9px;
  text-decoration: none;
  font-size: 22px;
  color: #fff;
  background: rgba(0,0,80,0.5);
  padding: 6px 10px;
  border-radius: 10px;
  transition: 0.3s;
}

header a:hover {
  background: rgba(0,0,80,0.8);
}

.messages {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 15px;
  scrollbar-width: thin;
  margin-bottom: 70px;
  background: rgba(0, 0, 50, 0.35);
  backdrop-filter: blur(8px);
  border-top: 1px solid rgba(255,255,255,0.05);
  border-bottom: 1px solid rgba(255,255,255,0.1);
  box-shadow: inset 0 0 15px rgba(0,0,0,0.2);
}

.message {
  padding: 10px 14px;
  border-radius: 12px;
  max-width: 70%;
  word-wrap: break-word;
  animation: fadeIn 0.3s ease-in;
}

.message.admin {
  background: gold;
  color: black;
  align-self: flex-end;
  border-bottom-right-radius: 0;
}

.message.user {
  background: rgba(255, 255, 255, 0.2);
  color: #fff;
  align-self: flex-start;
  border-bottom-left-radius: 0;
}

.input-area {
  position: fixed;
  left: 0;
  bottom: 0;
  width: 100%;
  display: flex;
  gap: 5px;
  padding: 8px;
  background: rgba(0,0,50,0.85);
  box-shadow: 0 -2px 8px rgba(0,0,0,0.3);
  border-top: 1px solid rgba(255,255,255,0.1);
  z-index: 10;
  backdrop-filter: blur(5px);
}

.input-area input {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: none;
  outline: none;
  font-size: 16px;
  color: #000;
}

.input-area button {
  background-color: gold;
  color: black;
  border: none;
  border-radius: 10px;
  padding: 12px 18px;
  cursor: pointer;
  font-size: 16px;
  transition: transform 0.3s ease, background 0.3s ease;
}

.input-area button:hover {
  transform: scale(1.05);
  background-color: #ffd700;
}

@media (max-width: 500px) {
  .input-area input { padding: 10px; font-size: 14px; }
  .input-area button { padding: 10px 14px; font-size: 14px; }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(5px); }
  to { opacity: 1; transform: translateY(0); }
}
  </style>
</head>
<body>
  <header>
    <a href="admin-chat-list.html">⬅</a>
    Admin Chat 💬
  </header>

  <div id="messages" class="messages"></div>

  <div class="input-area">
    <input type="text" id="chatInput" placeholder="Type your message..." />
    <button id="sendBtn">Send</button>
  </div>

  <!-- Socket.IO -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
  const messagesDiv = document.getElementById("messages");
  const input = document.getElementById("chatInput");
  const sendBtn = document.getElementById("sendBtn");

  // ✅ Parse query params
  const params = new URLSearchParams(window.location.search);
  const userId = params.get("userId");
  const room = params.get("room") || `room_${userId}`;

  // ✅ Connect to backend
  const socket = io("https://contesto.onrender.com", {
    transports: ["websocket"],
    reconnection: true,
  });

  // ✅ Join chat room
  socket.emit("joinRoom", room);

  // ✅ Fetch chat history
  async function loadChatHistory() {
    try {
      const res = await fetch(`https://contesto.onrender.com/api/chat/messages/${room}`);
      const data = await res.json();

      // Match the backend field names
      data.forEach(msg => {
        const senderClass = msg.senderRole === "admin" ? "admin" : "user";
        appendMessage(senderClass, msg.message);
      });
    } catch (err) {
      console.error("Failed to load chat history:", err);
    }
  }

  loadChatHistory();

  // ✅ Append message to UI
  function appendMessage(senderClass, text) {
    const div = document.createElement("div");
    div.classList.add("message", senderClass);
    div.textContent = text;
    messagesDiv.appendChild(div);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  // ✅ Send message
  sendBtn.addEventListener("click", sendMessage);
  input.addEventListener("keypress", (e) => {
    if (e.key === "Enter") sendMessage();
  });

  function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    // Emit message
    socket.emit("sendMessage", { room, senderRole: "admin", message: text, receiverId: userId });

    // Save to DB
    fetch("https://contesto.onrender.com/api/chat/message", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        room,
        senderId: "admin", // or your logged-in admin ID if stored
        senderRole: "admin",
        receiverId: userId,
        message: text
      }),
    });

    appendMessage("admin", text);
    input.value = "";
  }

  // ✅ Receive message
  socket.on("receiveMessage", ({ senderRole, message }) => {
    if (senderRole !== "admin") appendMessage("user", message);
  });

  // ✅ Adjust input on mobile
  const inputArea = document.querySelector('.input-area');
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', () => {
     const vh = window.visualViewport.height;
      const fullHeight = window.innerHeight;
      const keyboardHeight = fullHeight - vh;
      if (keyboardHeight > 100) {
        inputArea.style.bottom = keyboardHeight + 'px';
      } else {
        inputArea.style.bottom = '0px';
      }
    });
  }
</script>
</body>
</html>
