<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>🏆 Admin Chat - Contesto</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #001848, #00336e);
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: rgba(0, 0, 60, 0.7);
      padding: 15px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      color: #fff;
      position: relative;
      flex-shrink: 0;
    }

    header a {
      position: absolute;
      left: 15px;
      top: 9px;
      text-decoration: none;
      font-size: 22px;
      color: #fff;
      background: rgba(0, 0, 80, 0.5);
      padding: 6px 10px;
      border-radius: 10px;
      transition: 0.3s;
    }

    header a:hover {
      background: rgba(0, 0, 80, 0.8);
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 15px;
      padding-bottom: 125px;
      scrollbar-width: thin;
      background: rgba(0, 0, 50, 0.35);
      backdrop-filter: blur(8px);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.2);
    }

    .message {
      padding: 10px 14px;
      border-radius: 12px;
      max-width: 75%;
      word-wrap: break-word;
      animation: fadeIn 0.3s ease-in;
    }

    .message.admin {
      background: gold;
      color: black;
      align-self: flex-end;
      border-bottom-right-radius: 0;
    }

    .message.user {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      align-self: flex-start;
      border-bottom-left-radius: 0;
    }

    .input-area {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      display: flex;
      gap: 5px;
      padding: 10px;
      background: rgba(0, 0, 50, 0.85);
      box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.3);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 10;
      backdrop-filter: blur(5px);
    }

    .input-area input {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      outline: none;
      font-size: 16px;
      color: #000;
    }

    .input-area button {
      background-color: gold;
      color: black;
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      cursor: pointer;
      font-size: 16px;
      transition: transform 0.3s ease, background 0.3s ease;
    }

    .input-area button:hover {
      transform: scale(1.05);
      background-color: #ffd700;
    }

    .reply-preview {
      position: fixed;
      bottom: 60px;
      left: 0;
      width: 100%;
      background: rgba(0, 0, 80, 0.7);
      color: #fff;
      padding: 8px 12px;
      display: none;
      align-items: center;
      justify-content: space-between;
      border-left: 4px solid gold;
      font-size: 14px;
      z-index: 11;
    }

    .reply-preview span {
      opacity: 0.9;
    }

    .reply-preview button {
      background: none;
      border: none;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }

    .reply-box {
      background: rgba(255, 255, 255, 0.15);
      padding: 6px 8px;
      border-left: 3px solid black;
      border-right: 2px solid black;
      border-radius: 6px;
      margin-bottom: 5px;
      font-size: 13px;
      opacity: 0.85;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <header>
    <a href="admin-dashboard.html">⬅</a>
    Admin Chat 💬
  </header>

  <div id="messages" class="messages"></div>

  <div class="reply-preview" id="replyPreview">
    <span id="replyText"></span>
    <button onclick="cancelReply()">✖</button>
  </div>

  <div class="input-area">
    <input type="text" id="chatInput" placeholder="Type a message..." />
    <button id="sendBtn">Send</button>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    const API_BASE_URL = "https://contesto.onrender.com";
    const socket = io(API_BASE_URL, { transports: ["websocket"], reconnection: true });

    const messagesDiv = document.getElementById("messages");
    const input = document.getElementById("chatInput");
    const sendBtn = document.getElementById("sendBtn");

    const params = new URLSearchParams(window.location.search);
    const userId = params.get("userId");
    const room = `user_${userId}`;
    socket.emit("joinRoom", room);

    let replyToMessage = null;

    function scrollToBottom() {
      messagesDiv.scrollTo({ top: messagesDiv.scrollHeight, behavior: "smooth" });
    }

    function appendMessage(sender, text, replyTo = null) {
      const msg = document.createElement("div");
      msg.classList.add("message", sender);

      if (replyTo) {
        const replyBox = document.createElement("div");
        replyBox.classList.add("reply-box");
        replyBox.textContent = replyTo;
        msg.appendChild(replyBox);
      }

      const mainText = document.createElement("div");
      mainText.textContent = text;
      msg.appendChild(mainText);
      messagesDiv.appendChild(msg);
      scrollToBottom();
    }

    async function loadMessages() {
      try {
        const res = await fetch(`${API_BASE_URL}/api/chat/messages/${room}`);
        const data = await res.json();
        messagesDiv.innerHTML = "";
        if (!data || data.length === 0) {
          appendMessage("system", "No messages yet from this user.");
          return;
        }
        data.forEach(msg => {
          appendMessage(msg.senderRole === "admin" ? "admin" : "user", msg.message, msg.replyTo);
        });
      } catch (err) {
        console.error("❌ Error loading messages:", err);
      }
    }

    loadMessages();

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      appendMessage("admin", text, replyToMessage);
      input.value = "";
      document.getElementById("replyPreview").style.display = "none";

      const payload = {
        senderId: "admin",
        senderRole: "admin",
        receiverId: userId,
        message: text,
        replyTo: replyToMessage,
        room
      };

      replyToMessage = null;

      try {
        await fetch(`${API_BASE_URL}/api/chat/send`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        socket.emit("sendMessage", { room, senderRole: "admin", message: text });
      } catch (err) {
        console.error("❌ Error sending message:", err);
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    input.addEventListener("keypress", e => e.key === "Enter" && sendMessage());

    socket.on("receiveMessage", ({ senderRole, message, replyTo }) => {
      if (senderRole === "user") appendMessage("user", message, replyTo);
    });

    // Swipe detection for reply
    let startX, startY;
    messagesDiv.addEventListener("touchstart", e => {
      const touch = e.touches[0];
      startX = touch.clientX;
      startY = touch.clientY;
    });

    messagesDiv.addEventListener("touchend", e => {
      const touch = e.changedTouches[0];
      const deltaX = touch.clientX - startX;
      const deltaY = Math.abs(touch.clientY - startY);
      if (deltaX > 60 && deltaY < 50) {
        const allMessages = Array.from(document.querySelectorAll(".message"));
        const closest = allMessages.reduce((nearest, msg) => {
          const rect = msg.getBoundingClientRect();
          const dist = Math.abs(rect.top - touch.clientY);
          return dist < (nearest?.dist ?? Infinity) ? { msg, dist } : nearest;
        }, null);
        if (closest) triggerReply(closest.msg);
      }
    });

    function triggerReply(messageEl) {
      messageEl.style.transition = "transform 0.2s ease, background 0.2s ease";
      messageEl.style.transform = "translateX(25px)";
      messageEl.style.background = "rgba(255,215,0,0.3)";
      setTimeout(() => {
        messageEl.style.transform = "";
        messageEl.style.background = "";
      }, 250);

      const text = messageEl.textContent.trim().substring(0, 50);
      replyToMessage = text;
      document.getElementById("replyText").textContent = text;
      document.getElementById("replyPreview").style.display = "flex";
    }

    function cancelReply() {
      replyToMessage = null;
      document.getElementById("replyPreview").style.display = "none";
    }
  </script>
</body>
  </html>
