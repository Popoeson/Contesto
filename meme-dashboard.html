<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Meme Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 10px;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
      overflow-x: auto;
    }

    h2 {
      text-align: center;
      color: #fff;
      font-size: 26px;
      margin-bottom: 25px;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 10px;
      min-width: 900px;
    }

    th {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      font-weight: 600;
      padding: 12px;
      border-radius: 8px;
      text-transform: uppercase;
      font-size: 13px;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    td {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      text-align: center;
      padding: 15px;
      border-radius: 10px;
      backdrop-filter: blur(6px);
      font-size: 14px;
      vertical-align: middle;
    }

    img {
      width: 80px;
      height: auto;
      border-radius: 8px;
      border: 2px solid #fff;
      transition: transform 0.2s;
    }

    img:hover { transform: scale(1.05); }

    .btn {
      border: none;
      padding: 8px 14px;
      border-radius: 25px;
      cursor: pointer;
      color: #fff;
      font-weight: 600;
      transition: all 0.25s ease;
      font-size: 13px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
      white-space: nowrap;
    }

    .btn:hover { transform: translateY(-2px); opacity: 0.95; }

    .vote-btn.start { background: #27ae60; }
    .vote-btn.end { background: #e74c3c; }

    .archive-btn.archive { background: #2980b9; }
    .archive-btn.archived { background: #c0392b; }

    .delete-btn { background: linear-gradient(135deg, #e74c3c, #c0392b); }

    .status-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 5px;
    }
    .status-dot.on { background-color: #2ecc71; }
    .status-dot.off { background-color: #e74c3c; }

    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 14px;
      animation: slideIn 0.3s ease, fadeOut 0.5s ease 2.5s forwards;
      z-index: 9999;
    }

    .toast.success { background: #2ecc71; }
    .toast.error { background: #e74c3c; }
    .toast.info { background: #3498db; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeOut { to { opacity: 0; transform: translateY(-10px); } }

    @media (max-width: 768px) {
      body { padding: 20px 5px; }
      .container { padding: 15px; }
      h2 { font-size: 22px; }
      table { font-size: 12px; min-width: 700px; }
      img { width: 60px; }
      .btn { font-size: 12px; padding: 6px 10px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🏆 Meme Dashboard</h2>
    <table id="memeTable">
      <thead>
        <tr>
          <th>Preview</th>
          <th>Captions</th>
          <th>Uploaded</th>
          <th>Vote</th>
          <th>Archive</th>
          <th>Delete</th>
        </tr>
      </thead>
      <tbody><tr><td colspan="6">Loading memes...</td></tr></tbody>
    </table>
  </div>

  <script>
  const apiBase = "https://contesto.onrender.com/api/memes";

  // ✅ Toast notification
  function showToast(message, type = "info") {
    const toast = document.createElement("div");
    toast.className = `toast ${type}`;
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  }

  // ✅ Fetch all memes once
  async function fetchMemes() {
    try {
      const res = await fetch(apiBase);
      const memes = await res.json();
      const tbody = document.querySelector("#memeTable tbody");
      tbody.innerHTML = "";

      memes.reverse().forEach(meme => {
        const isVotingActive = meme.isVotingActive || false;
        const isArchived = meme.isArchived || false;
        const date = new Date(meme.createdAt || meme.uploadedAt).toLocaleString();

        const row = document.createElement("tr");
        row.dataset.id = meme._id;

        row.innerHTML = `
          <td><img src="${meme.imageUrl}" alt="meme" /></td>
          <td>${meme.captionCount || 0}</td>
          <td>${date}</td>
          <td>
            <span class="status-dot ${isVotingActive ? 'on' : 'off'}"></span>
            <button type="button" class="btn vote-btn ${isVotingActive ? 'end' : 'start'}"
              onclick="toggleVote(this, '${meme._id}', ${isVotingActive})">
              ${isVotingActive ? 'End Vote' : 'Start Vote'}
            </button>
          </td>
          <td>
            <span class="status-dot ${isArchived ? 'on' : 'off'}"></span>
            <button type="button" class="btn archive-btn ${isArchived ? 'archived' : 'archive'}"
              onclick="toggleArchive(this, '${meme._id}', ${isArchived})">
              ${isArchived ? 'Archived' : 'Archive'}
            </button>
          </td>
          <td>
            <button type="button" class="btn delete-btn" onclick="deleteMeme('${meme._id}', this)">Delete</button>
          </td>
        `;
        tbody.appendChild(row);
      });
    } catch (err) {
      console.error("Failed to load memes:", err);
      showToast("⚠️ Failed to load memes", "error");
    }
  }

  // ✅ Toggle voting instantly (no reload)
  async function toggleVote(button, id, currentState) {
    const isStarting = !currentState;
    const statusDot = button.closest("td").querySelector(".status-dot");

    // Instant UI feedback
    button.textContent = isStarting ? "End Vote" : "Start Vote";
    button.classList.toggle("start", !isStarting);
    button.classList.toggle("end", isStarting);
    statusDot.classList.toggle("on", isStarting);
    statusDot.classList.toggle("off", !isStarting);

    try {
      const res = await fetch(`${apiBase}/${id}/vote`, { method: "PATCH" });
      if (res.ok) {
        showToast(isStarting ? "✅ Voting started" : "✅ Voting ended", "success");
      } else {
        showToast("⚠️ Failed to toggle voting", "error");
      }
    } catch {
      showToast("❌ Network error while toggling vote", "error");
    }
  }

  // ✅ Toggle archive instantly (no reload)
  async function toggleArchive(button, id, currentState) {
    const isArchiving = !currentState;
    const statusDot = button.closest("td").querySelector(".status-dot");

    // Instant UI feedback
    button.textContent = isArchiving ? "Archived" : "Archive";
    button.classList.toggle("archive", !isArchiving);
    button.classList.toggle("archived", isArchiving);
    statusDot.classList.toggle("on", isArchiving);
    statusDot.classList.toggle("off", !isArchiving);

    try {
      const res = await fetch(`${apiBase}/${id}/archive`, { method: "PATCH" });
      if (res.ok) {
        showToast(isArchiving ? "✅ Meme archived" : "✅ Meme unarchived", "success");
      } else {
        showToast("⚠️ Failed to update archive status", "error");
      }
    } catch {
      showToast("❌ Network error while updating archive", "error");
    }
  }

  // ✅ Delete meme (remove row instantly)
  async function deleteMeme(id, btn) {
    if (!confirm("Are you sure you want to delete this meme?")) return;
    const row = btn.closest("tr");
    try {
      const res = await fetch(`${apiBase}/${id}`, { method: "DELETE" });
      if (res.ok) {
        row.remove();
        showToast("🗑️ Meme deleted", "success");
      } else {
        showToast("❌ Failed to delete meme", "error");
      }
    } catch {
      showToast("⚠️ Network error while deleting meme", "error");
    }
  }

  fetchMemes();
  </script>
</body>
  </html>
