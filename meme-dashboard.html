<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🗳️ Meme Voting Control - Contesto Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background: linear-gradient(135deg, #001f3f, #0074D9);
      color: white;
    }

    h1 {
      text-align: center;
      margin: 20px 0;
      letter-spacing: 1px;
    }

    table {
      width: 95%;
      margin: 20px auto;
      border-collapse: collapse;
      background: white;
      color: #333;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    th, td {
      padding: 12px 15px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    th {
      background: #0074D9;
      color: white;
    }

    tr:hover {
      background: #f4f4f4;
    }

    img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 10px;
    }

    button {
      border: none;
      color: white;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .start-btn {
      background: #2ecc71;
    }

    .end-btn {
      background: #e74c3c;
    }

    .archive-btn {
      background: #555;
    }

    .unarchive-btn {
      background: #f39c12;
    }

    .status-dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 6px;
    }

    .on {
      background: limegreen;
    }

    .off {
      background: red;
    }

    .toast {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 12px 20px;
      border-radius: 6px;
      animation: fadeInOut 3s ease forwards;
      z-index: 1000;
    }

    @keyframes fadeInOut {
      0% { opacity: 0; transform: translateY(10px); }
      10% { opacity: 1; transform: translateY(0); }
      90% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(10px); }
    }
  </style>
</head>
<body>
  <h1>🗳️ Meme Voting Control Panel</h1>

  <table id="memeTable">
    <thead>
      <tr>
        <th>Image</th>
        <th>Voting Status</th>
        <th>Vote Toggle</th>
        <th>Archive Status</th>
        <th>Archive Toggle</th>
      </tr>
    </thead>
    <tbody id="memeBody"></tbody>
  </table>

  <script>
    const apiBase = "https://contesto.onrender.com/api/memes";

    // ✅ Show toast message
    function showToast(message) {
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    // ✅ Fetch memes from backend
    async function fetchMemes() {
      try {
        const res = await fetch(apiBase);
        const memes = await res.json();
        renderMemes(memes);
      } catch (err) {
        console.error(err);
        showToast("⚠️ Failed to load memes");
      }
    }

    // ✅ Render table rows (reflect actual DB state only)
    function renderMemes(memes) {
      const body = document.getElementById("memeBody");
      body.innerHTML = "";

      memes.forEach(meme => {
        const row = document.createElement("tr");

        // Image
        const imgTd = document.createElement("td");
        imgTd.innerHTML = `<img src="${meme.imageUrl}" alt="Meme Image">`;

        // Voting status (reflect DB state only)
        const voteStatusTd = document.createElement("td");
        voteStatusTd.innerHTML = `
          <span class="status-dot ${meme.isVotingActive ? "on" : "off"}"></span>
          ${meme.isVotingActive ? "Active" : "Inactive"}
        `;

        // Vote toggle button (only user action changes it)
        const voteBtnTd = document.createElement("td");
        const voteBtn = document.createElement("button");
        voteBtn.textContent = meme.isVotingActive ? "End Vote" : "Start Vote";
        voteBtn.className = meme.isVotingActive ? "end-btn" : "start-btn";
        voteBtn.onclick = () => toggleVote(voteBtn, meme._id, meme.isVotingActive);
        voteBtnTd.appendChild(voteBtn);

        // Archive status
        const archiveStatusTd = document.createElement("td");
        archiveStatusTd.textContent = meme.isArchived ? "Archived" : "Visible";

        // Archive toggle button
        const archiveBtnTd = document.createElement("td");
        const archiveBtn = document.createElement("button");
        archiveBtn.textContent = meme.isArchived ? "Unarchive" : "Archive";
        archiveBtn.className = meme.isArchived ? "unarchive-btn" : "archive-btn";
        archiveBtn.onclick = () => toggleArchive(archiveBtn, meme._id, meme.isArchived);
        archiveBtnTd.appendChild(archiveBtn);

        row.append(imgTd, voteStatusTd, voteBtnTd, archiveStatusTd, archiveBtnTd);
        body.appendChild(row);
      });
    }

    // ✅ Toggle Voting (user click only)
    async function toggleVote(button, id, currentState) {
      const nextState = !currentState;

      try {
        const res = await fetch(`${apiBase}/${id}/vote`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ isVotingActive: nextState })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || "Failed to update voting state");

        showToast(data.message);

        // Reflect the real saved state from DB
        button.textContent = data.meme.isVotingActive ? "End Vote" : "Start Vote";
        button.className = data.meme.isVotingActive ? "end-btn" : "start-btn";

        const row = button.closest("tr");
        const statusTd = row.querySelector("td:nth-child(2)");
        statusTd.innerHTML = `
          <span class="status-dot ${data.meme.isVotingActive ? "on" : "off"}"></span>
          ${data.meme.isVotingActive ? "Active" : "Inactive"}
        `;

        // Keep next correct state for next click
        button.onclick = () => toggleVote(button, id, data.meme.isVotingActive);
      } catch (err) {
        console.error(err);
        showToast("❌ Error updating vote");
      }
    }

    // ✅ Toggle Archive (user click only)
    async function toggleArchive(button, id, currentState) {
      const nextState = !currentState;

      try {
        const res = await fetch(`${apiBase}/${id}/archive`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ isArchived: nextState })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || "Failed to update archive state");

        showToast(data.message);

        // Reflect actual DB state
        button.textContent = data.meme.isArchived ? "Unarchive" : "Archive";
        button.className = data.meme.isArchived ? "unarchive-btn" : "archive-btn";

        const row = button.closest("tr");
        const archiveStatusTd = row.querySelector("td:nth-child(4)");
        archiveStatusTd.textContent = data.meme.isArchived ? "Archived" : "Visible";

        button.onclick = () => toggleArchive(button, id, data.meme.isArchived);
      } catch (err) {
        console.error(err);
        showToast("❌ Error updating archive");
      }
    }

    // 🚀 Load memes initially (reflect DB only, don’t change anything)
    fetchMemes();
  </script>
</body>
  </html>
