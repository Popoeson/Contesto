<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Meme Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 10px;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
      overflow-x: auto;
    }

    h2 {
      text-align: center;
      color: #fff;
      font-size: 26px;
      margin-bottom: 25px;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 10px;
      min-width: 900px;
    }

    th {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      font-weight: 600;
      padding: 12px;
      border-radius: 8px;
      text-transform: uppercase;
      font-size: 13px;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    td {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      text-align: center;
      padding: 15px;
      border-radius: 10px;
      backdrop-filter: blur(6px);
      font-size: 14px;
      vertical-align: middle;
    }

    img {
      width: 80px;
      height: auto;
      border-radius: 8px;
      border: 2px solid #fff;
      transition: transform 0.2s;
    }

    img:hover {
      transform: scale(1.05);
    }

    .btn {
      border: none;
      padding: 8px 14px;
      border-radius: 25px;
      cursor: pointer;
      color: #fff;
      font-weight: 600;
      transition: all 0.25s ease;
      font-size: 13px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
      white-space: nowrap;
    }

    .btn:hover {
      transform: translateY(-2px);
      opacity: 0.95;
    }

    /* ✅ BUTTON COLORS */
    .vote-btn.start { background: #27ae60; }
    .vote-btn.end { background: #e74c3c; }

    .archive-btn.archive { background: #2980b9; }
    .archive-btn.archived { background: #c0392b; }

    .delete-btn { background: linear-gradient(135deg, #e74c3c, #c0392b); }

    .status-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 5px;
    }
    .status-dot.on { background-color: #2ecc71; }
    .status-dot.off { background-color: #e74c3c; }

    @media (max-width: 768px) {
      body { padding: 20px 5px; }
      .container { padding: 15px; }
      h2 { font-size: 22px; }
      table { font-size: 12px; min-width: 700px; }
      img { width: 60px; }
      .btn { font-size: 12px; padding: 6px 10px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🏆 Meme Dashboard</h2>
    <table id="memeTable">
      <thead>
        <tr>
          <th>Preview</th>
          <th>Captions</th>
          <th>Uploaded</th>
          <th>Vote</th>
          <th>Archive</th>
          <th>Delete</th>
        </tr>
      </thead>
      <tbody><tr><td colspan="6">Loading memes...</td></tr></tbody>
    </table>
  </div>

  <script>
    const apiBase = "https://contesto.onrender.com/api/memes";

    async function fetchMemes() {
      try {
        const res = await fetch(apiBase);
        const memes = await res.json();
        const tbody = document.querySelector("#memeTable tbody");
        tbody.innerHTML = "";

        memes.forEach(meme => {
          const isVotingActive = meme.isVotingActive || false;
          const isArchived = meme.isArchived || false;
          const date = new Date(meme.createdAt || meme.uploadedAt).toLocaleString();

          const row = document.createElement("tr");
          row.innerHTML = `
            <td><img src="${meme.imageUrl}" alt="meme" /></td>
            <td>${meme.captionCount || 0}</td>
            <td>${date}</td>
            <td>
              <span class="status-dot ${isVotingActive ? 'on' : 'off'}"></span>
              <button class="btn vote-btn ${isVotingActive ? 'end' : 'start'}"
                onclick="toggleVote(this, '${meme._id}', ${isVotingActive})">
                ${isVotingActive ? 'End Vote' : 'Start Vote'}
              </button>
            </td>
            <td>
              <span class="status-dot ${isArchived ? 'on' : 'off'}"></span>
              <button class="btn archive-btn ${isArchived ? 'archived' : 'archive'}"
                onclick="toggleArchive(this, '${meme._id}', ${isArchived})">
                ${isArchived ? 'Archived' : 'Archive'}
              </button>
            </td>
            <td>
              <button class="btn delete-btn" onclick="deleteMeme('${meme._id}')">Delete</button>
            </td>
          `;
          tbody.appendChild(row);
        });
      } catch (err) {
        console.error("Failed to load memes:", err);
      }
    }

    // ✅ Toggle vote state instantly
    async function toggleVote(button, id, currentState) {
      const isStarting = !currentState;
      button.textContent = isStarting ? "End Vote" : "Start Vote";
      button.classList.toggle("end", isStarting);
      button.classList.toggle("start", !isStarting);

      try {
        const res = await fetch(`${apiBase}/${id}/vote`, { method: "PATCH" });
        const data = await res.json();
        console.log(data.message);
        fetchMemes();
      } catch (err) {
        console.error("Error toggling vote:", err);
      }
    }

    // ✅ Toggle archive state instantly
    async function toggleArchive(button, id, currentState) {
      const isArchiving = !currentState;
      button.textContent = isArchiving ? "Archived" : "Archive";
      button.classList.toggle("archived", isArchiving);
      button.classList.toggle("archive", !isArchiving);

      try {
        const res = await fetch(`${apiBase}/${id}/archive`, { method: "PATCH" });
        const data = await res.json();
        console.log(data.message);
        fetchMemes();
      } catch (err) {
        console.error("Error toggling archive:", err);
      }
    }

    async function deleteMeme(id) {
      const confirmDelete = confirm("Are you sure you want to delete this meme?");
      if (!confirmDelete) return;
      try {
        const res = await fetch(`${apiBase}/${id}`, { method: "DELETE" });
        if (res.ok) {
          alert("Meme deleted successfully!");
          fetchMemes();
        } else alert("Failed to delete meme.");
      } catch (err) {
        console.error("Error deleting meme:", err);
      }
    }

    fetchMemes();
  </script>
</body>
    </html>
