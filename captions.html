<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>All Captions - Contesto</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, royalblue, cyan);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
      min-height: 100vh;
      box-sizing: border-box;
    }

    header {
      display: flex;
      align-items: center;
      width: 100%;
      max-width: 700px;
      margin-bottom: 20px;
    }

    header a {
      text-decoration: none;
      color: #fff;
      font-size: 24px;
      background-color: rgba(0, 0, 50, 0.5);
      padding: 8px 12px;
      border-radius: 10px;
      transition: background 0.3s;
    }

    header a:hover {
      background-color: rgba(0, 0, 80, 0.8);
    }

    header h1 {
      flex: 1;
      text-align: center;
      font-size: 20px;
      margin: 0;
      color: #fff;
    }

    .feed {
      display: flex;
      flex-direction: column;
      gap: 25px;
      width: 100%;
      max-width: 700px;
    }

    .meme-card {
      background-color: rgba(0, 0, 50, 0.7);
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 0 10px #000;
    }

    .meme-card img {
      width: 100%;
      border-radius: 10px;
      border: 2px solid #fff;
      object-fit: contain;
      max-height: 350px;
    }

    .caption-list {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .caption-card {
      background-color: rgba(0, 0, 50, 0.6);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      box-shadow: 0 0 6px #000;
    }

    .caption-card img {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #fff;
    }

    .caption-info {
      flex: 1;
    }

    .caption-info h3 {
      margin: 0;
      font-size: 15px;
      color: #ffcc00;
    }

    .caption-info p {
      margin: 5px 0;
      font-size: 14px;
      word-break: break-word;
    }

    .time {
      font-size: 12px;
      color: #ccc;
      margin-top: 3px;
    }

    .empty {
      text-align: center;
      color: #eee;
      font-style: italic;
    }

    @media (max-width: 500px) {
      header h1 {
        font-size: 18px;
      }
      .caption-card img {
        width: 40px;
        height: 40px;
      }
    }
  </style>
</head>
<body>
  <header>
    <a href="contestants-home.html">🏠</a>
    <h1>💬 All Captions</h1>
  </header>

  <div class="feed" id="feedContainer">
    <p class="empty">Loading memes...</p>
  </div>

  <script>
    const API_BASE_URL = "https://contesto.onrender.com";

    function timeAgo(date) {
      const seconds = Math.floor((new Date() - new Date(date)) / 1000);
      const intervals = { year: 31536000, month: 2592000, week: 604800, day: 86400, hour: 3600, minute: 60 };
      for (let key in intervals) {
        const value = Math.floor(seconds / intervals[key]);
        if (value >= 1) return `${value}${key[0]} ago`;
      }
      return "Just now";
    }

    async function loadFeed() {
      const container = document.getElementById("feedContainer");

      try {
        const memeRes = await fetch(`${API_BASE_URL}/api/memes`);
        const memes = await memeRes.json();

        if (!Array.isArray(memes) || memes.length === 0) {
          container.innerHTML = `<p class="empty">No memes yet.</p>`;
          return;
        }

        // ✅ Sort so newest memes appear first
        memes.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

        const capRes = await fetch(`${API_BASE_URL}/api/caption-check`);
        const captions = await capRes.json();

        container.innerHTML = "";

        for (const meme of memes) {
          const memeCaptions = captions.filter(
            c => c.memeId === meme._id || c.meme === meme.imageUrl
          );

          const captionHTML = memeCaptions.length
            ? memeCaptions.map(c => {
                const username = c.username || "Unknown";
                const profilePic = c.profilePicture || `https://via.placeholder.com/100?text=${encodeURIComponent(username[0] || 'U')}`;
                const captionText = c.caption || "";
                const time = c.createdAt ? timeAgo(c.createdAt) : "";
                return `
                  <div class="caption-card">
                    <img src="${profilePic}" alt="user">
                    <div class="caption-info">
                      <h3>${username}</h3>
                      <p>${captionText}</p>
                      <div class="time">${time}</div>
                    </div>
                  </div>
                `;
              }).join("")
            : `<p class="empty">No captions yet.</p>`;

          // ✅ Insert newest memes first (top of the feed)
          container.insertAdjacentHTML(
            "afterbegin",
            `
            <div class="meme-card">
              <img src="${meme.imageUrl}" alt="Meme">
              <div class="caption-list">
                ${captionHTML}
              </div>
            </div>
            `
          );
        }
      } catch (err) {
        console.error(err);
        container.innerHTML = `<p class="empty">Failed to load feed.</p>`;
      }
    }

    loadFeed();
  </script>
</body>
</html>
