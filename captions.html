<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>All Captions - Contesto</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, royalblue, cyan);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
      min-height: 100vh;
      box-sizing: border-box;
    }

    header {
      display: flex;
      align-items: center;
      width: 100%;
      max-width: 700px;
      margin-bottom: 20px;
    }

    header a {
      text-decoration: none;
      color: #fff;
      font-size: 24px;
      background-color: rgba(0, 0, 50, 0.5);
      padding: 8px 12px;
      border-radius: 10px;
      transition: background 0.3s;
    }

    header a:hover {
      background-color: rgba(0, 0, 80, 0.8);
    }

    header h1 {
      flex: 1;
      text-align: center;
      font-size: 20px;
      margin: 0;
      color: #fff;
    }

    .meme-preview {
      background-color: rgba(0, 0, 50, 0.7);
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 0 10px #000;
      width: 100%;
      max-width: 700px;
      text-align: center;
      margin-bottom: 25px;
    }

    .meme-preview img {
      width: 100%;
      border-radius: 10px;
      border: 2px solid #fff;
      object-fit: contain;
      max-height: 350px;
    }

    .caption-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 700px;
    }

    .caption-card {
      background-color: rgba(0, 0, 50, 0.6);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      box-shadow: 0 0 6px #000;
    }

    .caption-card img {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #fff;
    }

    .caption-info {
      flex: 1;
    }

    .caption-info h3 {
      margin: 0;
      font-size: 15px;
      color: #ffcc00;
    }

    .caption-info p {
      margin: 5px 0;
      font-size: 14px;
      word-break: break-word;
    }

    .time {
      font-size: 12px;
      color: #ccc;
      margin-top: 3px;
    }

    .empty {
      text-align: center;
      color: #eee;
      margin-top: 20px;
      font-style: italic;
    }

    @media (max-width: 500px) {
      header h1 {
        font-size: 18px;
      }

      .caption-card {
        flex-direction: row;
        align-items: flex-start;
      }

      .caption-card img {
        width: 40px;
        height: 40px;
      }
    }
  </style>
</head>
<body>
  <header>
    <a href="contestants-home.html">🏠</a>
    <h1>💬 All Captions</h1>
  </header>

  <div class="meme-preview" id="memeContainer">
    <p>Loading meme...</p>
  </div>

  <div class="caption-list" id="captionList">
    <p class="empty">Loading captions...</p>
  </div>

  <script>
    const API_BASE_URL = "https://contesto.onrender.com";

    function timeAgo(date) {
      const seconds = Math.floor((new Date() - new Date(date)) / 1000);
      const intervals = { year: 31536000, month: 2592000, week: 604800, day: 86400, hour: 3600, minute: 60 };
      for (let key in intervals) {
        const value = Math.floor(seconds / intervals[key]);
        if (value >= 1) return `${value}${key[0]} ago`;
      }
      return "Just now";
    }

    async function loadMeme() {
      const container = document.getElementById("memeContainer");
      try {
        const res = await fetch(`${API_BASE_URL}/api/memes/latest`);
        const meme = await res.json();
        if (meme && meme.imageUrl) {
          container.innerHTML = `<img src="${meme.imageUrl}" alt="Latest Meme">`;
        } else {
          container.innerHTML = `<p>No meme available yet.</p>`;
        }
      } catch {
        container.innerHTML = `<p>Failed to load meme.</p>`;
      }
    }

    async function loadCaptions() {
      const list = document.getElementById("captionList");
      try {
        const res = await fetch(`${API_BASE_URL}/api/caption-check`);
        const captions = await res.json();

        if (!captions.length) {
          list.innerHTML = `<p class="empty">No captions yet.</p>`;
          return;
        }

        list.innerHTML = captions.map(c => {
          const username = c.username || "Unknown";
          const profilePic = c.profilePicture || `https://via.placeholder.com/100?text=${encodeURIComponent(username[0] || 'U')}`;
          const captionText = c.caption || "";
          const time = c.createdAt ? timeAgo(c.createdAt) : "";
          return `
            <div class="caption-card">
              <img src="${profilePic}" alt="${username}">
              <div class="caption-info">
                <h3>${username}</h3>
                <p>${captionText}</p>
                <div class="time">${time}</div>
              </div>
            </div>
          `;
        }).join('');
      } catch {
        list.innerHTML = `<p class="empty">Failed to load captions.</p>`;
      }
    }

    loadMeme();
    loadCaptions();
  </script>
</body>
</html>
