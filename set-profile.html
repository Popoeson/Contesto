<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Up Profile</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom right, #003366, #005f99);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
    }

    .profile-container {
      background: rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 15px;
      width: 350px;
     /* text-align: center;*/
      box-shadow: 0px 4px 12px rgba(0,0,0,0.3);
    }

    h2 {
      margin-bottom: 15px;
    }

    .profile-pic {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid white;
      margin-bottom: 10px;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      font-size: 14px;
    }

    input[type="file"] {
      background: none;
      color: white;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #00cc66;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #00994d;
    }

    .socials input {
      margin-bottom: 5px;
    }
  </style>
</head>
<body>
  <div class="profile-container">
    <h2>Set Up Your Profile</h2>
    
    <div>
        <label for="profilePicture">Select Profile Picture👤</label>
        <div>
            <img id="previewImage" class="profile-pic" src="https://via.placeholder.com/100" alt="Profile Picture">
        <input type="file" id="profilePictureInput" accept="image/*">
        </div>
        
      </div>
      
    
    <div>
        <label for="location">Location📍</label>
        <input type="text" id="location" placeholder="State or Region" required>
    </div>

    <div>
        <label for="about">Let's know you better☺️</label>
        <textarea id="about" placeholder="About yourself (optional)"></textarea>
    </div>
    
    <div>
        <label for="interst">Interests 🤔</label>
        <input type="text" id="interests" placeholder="Your interests (comma separated)">
    </div>
    
    <div>
        <label for="socials">Socials Link 🔗</label>
        <div class="socials">
      <input type="url" id="instagram" placeholder="Instagram link (optional)">
      <input type="url" id="twitter" placeholder="Twitter link (optional)">
      <input type="url" id="linkedin" placeholder="LinkedIn link (optional)">
    </div>
    </div>
    

    <button id="saveProfile">Save Profile</button>
  </div>

  <script>
    const profilePicInput = document.getElementById("profilePic");
    const previewImage = document.getElementById("previewImage");

    // Preview uploaded image
    profilePicInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) {
        previewImage.src = URL.createObjectURL(file);
      }
    });

    document.getElementById("saveProfile").addEventListener("click", async () => {
  const userId = localStorage.getItem("userId"); // saved from register step
  const location = document.getElementById("location").value.trim();

  if (!location) {
    alert("Location is required!");
    return;
  }

  const formData = new FormData();
  formData.append("profilePicture", document.getElementById("profilePicInput").files[0]); 
  formData.append("about", document.getElementById("about").value);
  formData.append("location", location);
  formData.append("interests", document.getElementById("interests").value);
  formData.append("instagram", document.getElementById("instagram").value);
  formData.append("twitter", document.getElementById("twitter").value);
  formData.append("linkedin", document.getElementById("linkedin").value);

  try {
    const response = await fetch(`https://contesto.onrender.com/api/users/complete-profile/${userId}`, {
      method: "POST",
      body: formData
    });

    const result = await response.json();
    if (response.ok) {
      alert("Profile saved successfully!");
      window.location.href = "dashboard.html";
    } else {
      alert("Error: " + result.message);
    }
  } catch (err) {
    console.error(err);
    alert("Something went wrong.");
  }
});
  </script>
</body>
</html>
