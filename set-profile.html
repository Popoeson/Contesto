<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Profile</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom right, #003366, #005f99);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: rgba(255, 255, 255, 0.1);
      padding: 25px;
      border-radius: 12px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border: none;
      border-radius: 6px;
      outline: none;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: #00cc66;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    button:hover {
      background: #00994d;
    }

    .preview {
      text-align: center;
      margin-top: 15px;
    }

    .preview img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid white;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Set Your Profile</h2>
    <form id="profileForm" enctype="multipart/form-data">
      <label for="profilePic">Profile Picture</label>
      <input type="file" id="profilePic" name="profilePic" accept="image/*">

      <div class="preview">
        <img id="previewImg" src="https://via.placeholder.com/120" alt="Preview">
      </div>

      <label for="location">Location <span style="color:red">*</span></label>
      <input type="text" id="location" name="location" required>

      <label for="about">About Yourself</label>
      <textarea id="about" name="about" rows="3"></textarea>

      <label for="interests">Interests</label>
      <input type="text" id="interests" name="interests" placeholder="E.g., music, coding">

      <label for="social">Social Media Links</label>
      <input type="text" id="social" name="social" placeholder="E.g., https://instagram.com/username">

      <button type="submit">Save Profile</button>
    </form>
  </div>

  <script>
    // 🔍 Show preview image
    const profilePicInput = document.getElementById("profilePic");
    const previewImg = document.getElementById("previewImg");

    profilePicInput.addEventListener("change", function () {
      const file = this.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function (e) {
          previewImg.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    // 📝 Handle form submit
    document.getElementById("profileForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const userId = localStorage.getItem("userId"); // ✅ saved from register/login step
      if (!userId) {
        alert("No user ID found. Please register again.");
        return;
      }

      const formData = new FormData();
      formData.append("profilePic", profilePicInput.files[0]);
      formData.append("location", document.getElementById("location").value);
      formData.append("about", document.getElementById("about").value);
      formData.append("interests", document.getElementById("interests").value);
      formData.append("social", document.getElementById("social").value);

      try {
        const res = await fetch(`https://contesto.onrender.com/api/users/complete-profile/${userId}`, {
          method: "POST",
          body: formData
        });

        if (!res.ok) {
          throw new Error("Failed to save profile");
        }

        const data = await res.json();
        alert("Profile saved successfully!");
        console.log(data);

        // redirect to dashboard
        window.location.href = "dashboard.html";
      } catch (error) {
        console.error(error);
        alert("Error saving profile");
      }
    });
  </script>
</body>
</html>
