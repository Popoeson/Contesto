<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🏆 Claim Reward Chat - Contesto</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, royalblue, cyan);
  color: #fff;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

header {
  background: rgba(0, 0, 50, 0.6);
  padding: 10px 15px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 10;
}

header a {
  text-decoration: none;
  color: #fff;
  font-size: 20px;
  background: rgba(255, 255, 255, 0.2);
  padding: 5px 10px;
  border-radius: 8px;
}

.chat-container {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 10px;
  overflow-y: auto;
  scroll-behavior: smooth;
  height: calc(100vh - 120px);
  box-sizing: border-box;
}

.welcome {
  text-align: center;
  font-size: 18px;
  background: rgba(0, 0, 50, 0.4);
  margin: 10px auto;
  padding: 10px 15px;
  border-radius: 10px;
  width: fit-content;
}

.message {
  max-width: 70%;
  padding: 10px 15px;
  border-radius: 15px;
  margin: 6px 0;
  animation: fadeIn 0.4s ease-in-out;
  word-wrap: break-word;
}

.admin {
  background: rgba(0, 0, 50, 0.7);
  align-self: flex-start;
  border-top-left-radius: 0;
}

.user {
  background: gold;
  color: black;
  align-self: flex-end;
  border-top-right-radius: 0;
}

/* === Fixed and Responsive Chat Input === */
.chat-input {
  display: flex;
  align-items: center;
  padding: 8px;
  background: rgba(0, 0, 50, 0.7);
  border-top: 1px solid rgba(255, 255, 255, 0.1);
  position: sticky;
  bottom: 0;
  width: 100%;
  box-sizing: border-box;
  backdrop-filter: blur(10px);
  z-index: 20;
}

.chat-input input {
  flex: 1;
  padding: 10px;
  border: none;
  border-radius: 10px;
  outline: none;
  font-size: 16px;
  background: rgba(255, 255, 255, 0.9);
  color: #000;
}

.chat-input button {
  margin-left: 8px;
  background: gold;
  border: none;
  padding: 10px 15px;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.2s ease;
  white-space: nowrap;
}

.chat-input button:hover {
  transform: scale(1.05);
}

/* === Adjustments for small screens === */
@media (max-width: 600px) {
  .chat-input input {
    font-size: 14px;
    padding: 8px;
  }

  .chat-input button {
    padding: 8px 12px;
    font-size: 14px;
  }
}

/* === Prevent keyboard overlap on mobile browsers === */
@supports (-webkit-touch-callout: none) {
  body {
    height: 100vh;
    overflow: hidden;
  }

  .chat-container {
    height: calc(100vh - 60px);
    overflow-y: auto;
  }

  .chat-input {
    position: fixed;
    bottom: 0;
    left: 0;
  }
}

/* === Animations === */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(5px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes confettiFall {
  to { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

.confetti {
  position: fixed;
  width: 10px;
  height: 10px;
  top: 0;
  border-radius: 50%;
  animation: confettiFall 3s linear infinite;
      }
  </style>
</head>
<body>
  <header>
    <a href="winner.html">⬅</a>
    Reward Claim Chat 💬
  </header>

  <div class="chat-container">
    <div id="messages" class="messages">
      <div class="message admin">👋 Hi there! Congratulations on winning! Please provide your details to claim your reward.</div>
    </div>

    <div class="input-area">
      <input type="text" id="chatInput" placeholder="Type your message..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const loggedInUser = JSON.parse(localStorage.getItem("user"));
    const claimWinnerId = localStorage.getItem("claimWinnerId");
    const messagesDiv = document.getElementById("messages");
    const input = document.getElementById("chatInput");

    function appendMessage(sender, text) {
      const msg = document.createElement("div");
      msg.classList.add("message", sender);
      msg.innerHTML = text;
      messagesDiv.appendChild(msg);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function sendMessage() {
      const text = input.value.trim();
      if (!text) return;
      appendMessage("user", text);
      input.value = "";

      // Simulate admin response
      setTimeout(() => {
        appendMessage("admin", "✅ Got it! The admin will verify your win and reach out shortly.");
      }, 1500);
    }

    // Greet the user dynamically
    if (loggedInUser && claimWinnerId) {
      appendMessage("admin", `🏆 Welcome ${loggedInUser.username}! Let's confirm your reward claim for winner ID: ${claimWinnerId}.`);
    }
  </script>
</body>
</html>
