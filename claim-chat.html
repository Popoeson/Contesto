<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🏆 Claim Reward Chat - Contesto</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
/* =============================
   🌟 Contesto Claim Chat Styles
   ============================= */
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, royalblue, cyan);
  color: #fff;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

header {
  background: rgba(0,0,50,0.6);
  padding: 15px;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
  color: #fff;
  position: relative;
  flex-shrink: 0;
  height: 22px;
}

header a {
  position: absolute;
  left: 15px;
  top: 9px;
  text-decoration: none;
  font-size: 22px;
  color: #fff;
  background: rgba(0,0,80,0.5);
  padding: 6px 10px;
  border-radius: 10px;
  transition: 0.3s;
}

header a:hover {
  background: rgba(0,0,80,0.8);
}

/* Messages area */
.messages {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 15px;
  scrollbar-width: thin;
  margin-bottom: 70px;
  background: rgba(0, 0, 50, 0.35);
  backdrop-filter: blur(8px);
  border-top: 1px solid rgba(255,255,255,0.05);
  border-bottom: 1px solid rgba(255,255,255,0.1);
  box-shadow: inset 0 0 15px rgba(0,0,0,0.2);
}

.message {
  padding: 10px 14px;
  border-radius: 12px;
  max-width: 75%;
  word-wrap: break-word;
  animation: fadeIn 0.3s ease-in;
}

.message.user {
  background: gold;
  color: black;
  align-self: flex-end;
  border-bottom-right-radius: 0;
}

.message.admin {
  background: rgba(255, 255, 255, 0.2);
  color: #fff;
  align-self: flex-start;
  border-bottom-left-radius: 0;
}

/* Input area */
.input-area {
  position: fixed;
  left: 0;
  bottom: 0;
  width: 100%;
  display: flex;
  gap: 5px;
  padding: 8px 0px;
  background: rgba(0,0,50,0.85);
  box-shadow: 0 -2px 8px rgba(0,0,0,0.3);
  border-top: 1px solid rgba(255,255,255,0.1);
  z-index: 10;
  backdrop-filter: blur(5px);
}

.input-area input {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: none;
  outline: none;
  font-size: 16px;
  color: #000;
}

.input-area button {
  background-color: gold;
  color: black;
  border: none;
  border-radius: 10px;
  padding: 12px 18px;
  cursor: pointer;
  font-size: 16px;
  transition: transform 0.3s ease, background 0.3s ease;
}

.input-area button:hover {
  transform: scale(1.05);
  background-color: #ffd700;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(5px); }
  to { opacity: 1; transform: translateY(0); }
}
  </style>
</head>
<body>
  <header>
    <a href="claim-wins.html">⬅</a>
    Reward Claim Chat 💬
  </header>

  <div id="messages" class="messages"></div>

  <div class="input-area">
    <input type="text" id="chatInput" placeholder="Type your message..." />
    <button onclick="sendMessage()">Send</button>
  </div>

  

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
  const API_BASE_URL = "https://contesto.onrender.com";
  const socket = io(API_BASE_URL, {
    transports: ["websocket"],
    reconnection: true
  });

  let loggedInUser = JSON.parse(localStorage.getItem("user"));
  const messagesDiv = document.getElementById("messages");
  const input = document.getElementById("chatInput");

  // 🔒 Ensure user is logged in
  if (!loggedInUser) {
    alert("Please log in to chat.");
    window.location.href = "login.html";
  }

  // 🧩 Normalize ID (handles id/_id inconsistency)
  if (loggedInUser && !loggedInUser._id && loggedInUser.id) {
    loggedInUser._id = loggedInUser.id;
  }

  // 🏠 Define unique room for this user
  const room = `user_${loggedInUser._id}`;
  socket.emit("joinRoom", room);

  // 🗨️ Append message to UI
  function appendMessage(sender, text) {
    const msg = document.createElement("div");
    msg.classList.add("message", sender);
    msg.textContent = text;
    messagesDiv.appendChild(msg);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  // 📜 Load previous messages
  async function loadMessages() {
    try {
      const res = await fetch(`${API_BASE_URL}/api/chat/messages/${room}`);
      const data = await res.json();

      messagesDiv.innerHTML = "";

      if (!data || data.length === 0) {
        // 👋 Greeting for first-time chat
        appendMessage("admin", `🎉 Congratulations ${loggedInUser.username} on winning the contest!`);
        appendMessage("admin", `How would you like to claim your reward — Airtime 📞 or Data 📶?`);
      } else {
        data.forEach(msg => {
          appendMessage(msg.senderRole === "user" ? "user" : "admin", msg.message);
        });
      }
    } catch (err) {
      console.error("❌ Error loading messages:", err);
    }
  }

  // 📤 Send message
  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    appendMessage("user", text);
    input.value = "";

    const payload = {
      senderId: loggedInUser._id,
      senderRole: "user",
      receiverId: "admin",
      message: text,
      room
    };

    console.log("📤 Sending message:", payload);

    // Save to backend
    try {
      const res = await fetch(`${API_BASE_URL}/api/chat/send`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        const errData = await res.json();
        console.error("❌ Message send failed:", errData);
        return;
      }

      // Emit real-time socket event
      socket.emit("sendMessage", { room, senderRole: "user", message: text });

      // 🤖 Auto acknowledgment
      if (/airtime/i.test(text) || /data/i.test(text)) {
        setTimeout(() => {
          appendMessage("admin", "✅ Thank you! An admin will reply to you shortly.");
        }, 1500);
      }
    } catch (err) {
      console.error("❌ Error sending message:", err);
    }
  }

  // 🖱️ Send message on button click or Enter key
  input.addEventListener("keypress", (e) => {
    if (e.key === "Enter") sendMessage();
  });

  // 💬 Receive message in real-time from admin
  socket.on("receiveMessage", ({ senderRole, message }) => {
    if (senderRole !== "user") {
      appendMessage("admin", message);
    }
  });

  // 🚀 Initialize chat
  loadMessages();
</script>
  
</body>
</html>
