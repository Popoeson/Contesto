<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🏆 Claim Reward Chat - Contesto</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, royalblue, cyan);
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: rgba(0,0,50,0.6);
      padding: 15px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      color: #fff;
      position: relative;
    }

    header a {
      position: absolute;
      left: 15px;
      top: 15px;
      text-decoration: none;
      font-size: 22px;
      color: #fff;
      background: rgba(0,0,80,0.5);
      padding: 6px 10px;
      border-radius: 10px;
      transition: 0.3s;
    }

    header a:hover {
      background: rgba(0,0,80,0.8);
    }

    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px;
      background: rgba(0, 0, 50, 0.6);
      border-radius: 16px;
      margin: 15px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 5px;
      scrollbar-width: thin;
    }

    .message {
      padding: 10px 14px;
      border-radius: 12px;
      max-width: 70%;
      word-wrap: break-word;
      animation: fadeIn 0.3s ease-in;
    }

    .message.user {
      background: gold;
      color: black;
      align-self: flex-end;
      border-bottom-right-radius: 0;
    }

    .message.admin {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      align-self: flex-start;
      border-bottom-left-radius: 0;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding-top: 10px;
      margin-bottom: 20px; /* 10px visible gap from screen bottom */
    }

    .input-area input {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      outline: none;
      font-size: 16px;
    }

    .input-area button {
      background-color: gold;
      color: black;
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      cursor: pointer;
      font-size: 16px;
      transition: transform 0.3s ease;
    }

    .input-area button:hover {
      transform: scale(1.05);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <header>
    <a href="winner.html">⬅</a>
    Reward Claim Chat 💬
  </header>

  <div class="chat-container">
    <div id="messages" class="messages">
      <div class="message admin">👋 Hi there! Congratulations on winning! Please provide your details to claim your reward.</div>
    </div>

    <div class="input-area">
      <input type="text" id="chatInput" placeholder="Type your message..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const loggedInUser = JSON.parse(localStorage.getItem("user"));
    const claimWinnerId = localStorage.getItem("claimWinnerId");
    const messagesDiv = document.getElementById("messages");
    const input = document.getElementById("chatInput");

    function appendMessage(sender, text) {
      const msg = document.createElement("div");
      msg.classList.add("message", sender);
      msg.innerHTML = text;
      messagesDiv.appendChild(msg);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function sendMessage() {
      const text = input.value.trim();
      if (!text) return;
      appendMessage("user", text);
      input.value = "";

      // Simulate admin response
      setTimeout(() => {
        appendMessage("admin", "✅ Got it! The admin will verify your win and reach out shortly.");
      }, 1500);
    }

    // Greet the user dynamically
    if (loggedInUser && claimWinnerId) {
      appendMessage("admin", `🏆 Welcome ${loggedInUser.username}! Let's confirm your reward claim for winner ID: ${claimWinnerId}.`);
    }
  </script>
</body>
</html>
