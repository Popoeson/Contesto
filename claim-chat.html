<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🏆 Claim Reward Chat - Contesto</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
/* =============================
   🌟 Contesto Claim Chat Styles
   ============================= */

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, royalblue, cyan);
  color: #fff;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

/* Header */
header {
  background: rgba(0,0,50,0.6);
  padding: 15px;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
  color: #fff;
  position: relative;
  flex-shrink: 0;
  height: 22px;
}

header a {
  position: absolute;
  left: 15px;
  top: 9px;
  text-decoration: none;
  font-size: 22px;
  color: #fff;
  background: rgba(0,0,80,0.5);
  padding: 6px 10px;
  border-radius: 10px;
  transition: 0.3s;
}

header a:hover {
  background: rgba(0,0,80,0.8);
}

/* =============================
   💬 Messages Area
   ============================= */
.messages {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 15px;
  scrollbar-width: thin;
  margin-bottom: 70px; /* space for input bar */

  /* ✨ Glassy translucent background */
  background: rgba(0, 0, 50, 0.35);
  backdrop-filter: blur(8px);
  border-top: 1px solid rgba(255,255,255,0.05);
  border-bottom: 1px solid rgba(255,255,255,0.1);
  box-shadow: inset 0 0 15px rgba(0,0,0,0.2);
  /*border-radius: 12px 12px 0 0;*/
}

.message {
  padding: 10px 14px;
  border-radius: 12px;
  max-width: 75%;
  word-wrap: break-word;
  animation: fadeIn 0.3s ease-in;
}

.message.user {
  background: gold;
  color: black;
  align-self: flex-end;
  border-bottom-right-radius: 0;
}

.message.admin {
  background: rgba(255, 255, 255, 0.2);
  color: #fff;
  align-self: flex-start;
  border-bottom-left-radius: 0;
}

/* ===============================
   📱 Fixed Input Bar (WhatsApp Style)
   =============================== */
.input-area {
  position: fixed;
  left: 0;
  bottom: 0;
  width: 100%;
  display: flex;
  gap: 5px;
  padding: 8px 0px;
  background: rgba(0,0,50,0.85);
  box-shadow: 0 -2px 8px rgba(0,0,0,0.3);
  border-top: 1px solid rgba(255,255,255,0.1);
  z-index: 10;
  backdrop-filter: blur(5px);
}

.input-area input {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: none;
  outline: none;
  font-size: 16px;
  color: #000;
}

.input-area button {
  background-color: gold;
  color: black;
  border: none;
  border-radius: 10px;
  padding: 12px 18px;
  cursor: pointer;
  font-size: 16px;
  transition: transform 0.3s ease, background 0.3s ease;
}

.input-area button:hover {
  transform: scale(1.05);
  background-color: #ffd700;
}

/* Responsive tweaks for smaller screens */
@media (max-width: 500px) {
  .input-area input {
    padding: 10px;
    font-size: 14px;
  }

  .input-area button {
    padding: 10px 14px;
    font-size: 14px;
  }
}

/* Smooth message fade-in */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(5px); }
  to { opacity: 1; transform: translateY(0); }
}
  </style>
</head>
<body>
  <header>
    <a href="winner.html">⬅</a>
    Reward Claim Chat 💬
  </header>

  <!-- Messages area -->
  <div id="messages" class="messages">
    <div class="message admin">
      👋 Hi there! Congratulations on winning! Please provide your details to claim your reward.
    </div>
  </div>

  <!-- Fixed Input Area -->
  <div class="input-area">
    <input type="text" id="chatInput" placeholder="Type your message..." />
    <button onclick="sendMessage()">Send</button>
  </div>

  <script>
    const loggedInUser = JSON.parse(localStorage.getItem("user"));
    const claimWinnerId = localStorage.getItem("claimWinnerId");
    const messagesDiv = document.getElementById("messages");
    const input = document.getElementById("chatInput");

    function appendMessage(sender, text) {
      const msg = document.createElement("div");
      msg.classList.add("message", sender);
      msg.innerHTML = text;
      messagesDiv.appendChild(msg);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function sendMessage() {
      const text = input.value.trim();
      if (!text) return;
      appendMessage("user", text);
      input.value = "";
      setTimeout(() => {
        appendMessage("admin", "✅ Got it! The admin will verify your win and reach out shortly.");
      }, 1500);
    }

    if (loggedInUser && claimWinnerId) {
      appendMessage("admin", `🏆 Welcome ${loggedInUser.username}! Let's confirm your reward claim for winner ID: ${claimWinnerId}.`);
      appendMessage("admin", `How would you like to claim your reward. Airtime 📞 or Data 📶`);
    
    }

    // ====== Fix for Mobile Keyboard (Dynamic Viewport Height)
    const inputArea = document.querySelector('.input-area');
    const messages = document.getElementById('messages');

    // Adjust chat height when keyboard opens
    window.visualViewport.addEventListener('resize', () => {
      const vh = window.visualViewport.height;
      const fullHeight = window.innerHeight;
      const keyboardHeight = fullHeight - vh;
      
      if (keyboardHeight > 100) {
        // Keyboard is open
        inputArea.style.bottom = keyboardHeight + 'px';
        messages.style.paddingBottom = (keyboardHeight + 70) + 'px';
      } else {
        // Keyboard closed
        inputArea.style.bottom = '0px';
        messages.style.paddingBottom = '70px';
      }
    });
  </script>
</body>
  </html>
