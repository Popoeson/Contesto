<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contesto Admin Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #0d47a1, #42a5f5);
      color: white;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    .search-container {
      text-align: center;
      margin-bottom: 20px;
    }
    .search-container input {
      padding: 8px;
      width: 300px;
      max-width: 80%;
      font-size: 16px;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.1);
      padding: 15px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .card img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 10px;
    }
    .card .status {
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 14px;
      margin: 8px 0;
    }
    .status.active {
      background: green;
    }
    .status.inactive {
      background: red;
    }
    .actions button {
      margin: 5px;
      padding: 6px 12px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .delete-btn {
      background: red;
      color: white;
    }
    .activate-btn {
      background: green;
      color: white;
    }
    .deactivate-btn {
      background: orange;
      color: white;
    }
  </style>
</head>
<body>
  <h1>Contesto Members</h1>

  <div class="search-container">
    <input type="text" id="searchInput" placeholder="Search by email or phone..." onkeyup="renderCards()">
  </div>

  <div class="cards" id="userCards"></div>

  <script>
    const API_URL = "https://contesto.onrender.com/api/users";
    let users = [];

    async function fetchUsers() {
      try {
        const res = await fetch(API_URL);
        users = await res.json();
        renderCards();
      } catch (err) {
        console.error("Failed to fetch users:", err);
      }
    }

    function renderCards() {
      const container = document.getElementById("userCards");
      const searchQuery = document.getElementById("searchInput").value.toLowerCase();

      const filtered = users.filter(u =>
        (u.email && u.email.toLowerCase().includes(searchQuery)) ||
        (u.phone && u.phone.toLowerCase().includes(searchQuery))
      );

      container.innerHTML = filtered.map(u => `
        <div class="card">
          <img src="${u.profilePicture}" alt="Profile">
          <h3>${u.serial}. ${u.email}</h3>
          <p><b>fullName:</b> ${u.fullName}</p>
          <p><b>username:</b> ${u.username}</p>
          <p><b>Phone:</b> ${u.phone}</p>
          <p><b>Location:</b> ${u.location}</p>
          <p><b>About:</b> ${u.about}</p>
          <p><b>Interest:</b> ${u.interest}</p>
          <p><b>Socials:</b> ${u.socials.length ? u.socials.join(", ") : "N/A"}</p>
          <div class="status ${u.status}">${u.status.toUpperCase()}</div>
          <div class="actions">
            <button class="delete-btn" onclick="deleteUser('${u.id}')">Delete</button>
            <button class="activate-btn" onclick="activateUser('${u.id}')">Activate</button>
            <button class="deactivate-btn" onclick="deactivateUser('${u.id}')">Deactivate</button>
          </div>
        </div>
      `).join('');
    }

    async function deleteUser(id) {
      if (!confirm("Delete this user?")) return;
      await fetch(`${API_URL}/${id}`, { method: "DELETE" });
      users = users.filter(u => u.id !== id);
      renderCards();
    }

    async function activateUser(id) {
      await fetch(`${API_URL}/${id}/activate`, { method: "PATCH" });
      users = users.map(u => u.id === id ? { ...u, status: "active" } : u);
      renderCards();
    }

    async function deactivateUser(id) {
      await fetch(`${API_URL}/${id}/deactivate`, { method: "PATCH" });
      users = users.map(u => u.id === id ? { ...u, status: "inactive" } : u);
      renderCards();
    }

    fetchUsers();
  </script>
</body>
</html>
