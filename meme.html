<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Meme Caption Contest</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, royalblue, cyan);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      background-color: rgba(0, 0, 50, 0.7);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 15px #000;
      width: 90%;
     /* max-width: 500px; */
      max-width: 300px
      text-align: center;
    }

    img {
      width: 100%;
      /*max-height: 300px;*/
      max-height: 250px
      object-fit: contain;
      border-radius: 10px;
      margin-bottom: 20px;
      border: 2px solid #fff;
    }

    textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      resize: none;
      font-size: 20px;
      margin-bottom: 10px;
    }

    .char-limit {
      font-size: 13px;
      margin-bottom: 10px;
      color: #ccc;
    }

    button {
      background-color: #ffcc00;
      color: #000;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s ease;
    }

    button:hover {
      background-color: #e0b800;
    }

    #spinner {
      display: none;
      margin-top: 15px;
    }

    #successMsg {
      margin-top: 10px;
      color: lightgreen;
      font-weight: bold;
    }

    #timer {
      margin-top: 20px;
      font-size: 14px;
      color: #ddd;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Caption This Meme</h2>
    <img src="uploads/today-meme.jpg" alt="Meme of the Day" id="memeImage">
    
    <p class="char-limit">Max 150 characters</p>
    <textarea id="captionInput" rows="4" maxlength="150" placeholder="Enter your funniest caption..."></textarea>

    <button id="submitBtn">Submit Caption</button>
    <div id="spinner">Submitting...</div>
    <div id="successMsg"></div>

    <div id="timer">⏳ Result will be announced at 9:00 PM</div>
  </div>

  
<script>
const username = localStorage.getItem("contestantUsername");

if (!username) {
  alert("You must login first");
  window.location.href = "reward-login.html";
}

const submitBtn = document.getElementById("submitBtn");
const spinner = document.getElementById("spinner");
const captionInput = document.getElementById("captionInput");
const successMsg = document.getElementById("successMsg");
const memeImage = document.getElementById("memeImage");

const API_BASE_URL = "https://contesto.onrender.com";

let memeData = null;

// ✅ Load latest meme
async function loadMeme() {
  try {
    const res = await fetch(`${API_BASE_URL}/api/memes/latest`);
    memeData = await res.json();

    if (memeData && memeData.imageUrl) {
      memeImage.src = memeData.imageUrl;
    } else {
      console.warn("No meme found or invalid format");
    }
  } catch (err) {
    console.error("Error loading meme:", err);
  }
}

loadMeme();

// ✅ Submit caption
submitBtn.addEventListener("click", async () => {
  const caption = captionInput.value.trim();

  if (!caption) {
    alert("Please enter a caption before submitting.");
    return;
  }
  if (!memeData) {
    alert("No meme loaded.");
    return;
  }

  spinner.style.display = "block";
  submitBtn.disabled = true;

  const meme = memeData.imageUrl;
  const memeId = memeData._id;

  try {
    // 🔍 Prevent duplicate caption
    const checkRes = await fetch(`${API_BASE_URL}/api/captions/check?username=${encodeURIComponent(username)}&meme=${encodeURIComponent(meme)}&memeId=${encodeURIComponent(memeId)}&caption=${encodeURIComponent(caption)}`);
    const checkData = await checkRes.json();

    if (checkRes.ok && checkData.exists) {
      alert("❌ You've already submitted a caption for this meme.");
      spinner.style.display = "none";
      submitBtn.disabled = false;
      return;
    }

    // ✅ Submit caption properly
    const response = await fetch(`${API_BASE_URL}/api/captions`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, caption, meme, memeId })
    });

    const result = await response.json();
    spinner.style.display = "none";
    submitBtn.disabled = false;

    if (response.ok) {
      successMsg.textContent = "✅ Caption submitted successfully!";
      captionInput.value = "";
    } else {
      alert("❌ " + (result.message || "Submission failed."));
    }
  } catch (err) {
    console.error("Error submitting caption:", err);
    alert("❌ Error submitting caption.");
    spinner.style.display = "none";
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
