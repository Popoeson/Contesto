<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Meme Caption Contest</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, royalblue, cyan);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      background-color: rgba(0, 0, 50, 0.7);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 15px #000;
      width: 90%;
      max-width: 400px;
      text-align: center;
    }

    img {
      width: 100%;
      max-height: 220px; /* ✅ set max height for consistency */
      object-fit: cover; /* neatly fits tall/long images */
      border-radius: 10px;
      margin-bottom: 20px;
      border: 2px solid #fff;
    }

    textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      resize: none;
      font-size: 16px;
      margin-bottom: 10px;
    }

    .char-limit {
      font-size: 13px;
      margin-bottom: 10px;
      color: #ccc;
    }

    button {
      background-color: #ffcc00;
      color: #000;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s ease;
    }

    button:hover {
      background-color: #e0b800;
    }

    button:disabled {
      background-color: gray;
      color: #fff;
      cursor: not-allowed;
    }

    #spinner {
      display: none;
      margin-top: 15px;
    }

    #successMsg {
      margin-top: 10px;
      color: lightgreen;
      font-weight: bold;
    }

    #timer {
      margin-top: 20px;
      font-size: 14px;
      color: #ddd;
    }

    #archiveNotice {
      margin-top: 15px;
      font-size: 14px;
      color: #ff6666;
      font-weight: bold;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Caption This Meme</h2>
    <img src="uploads/today-meme.jpg" alt="Meme of the Day" id="memeImage">
    
    <p class="char-limit">Max 150 characters</p>
    <textarea id="captionInput" rows="4" maxlength="150" placeholder="Enter your funniest caption..."></textarea>

    <button id="submitBtn">Submit Caption</button>
    <div id="spinner">Submitting...</div>
    <div id="successMsg"></div>

    <div id="archiveNotice">🚫 This meme has been archived. Caption submissions are closed.</div>
    <div id="timer">⏳ Result will be announced at 9:00 PM</div>
  </div>

  <script>
    const API_BASE_URL = "https://contesto.onrender.com";

    // ✅ Load user info
    const stored = localStorage.getItem('user');
    const user = stored ? JSON.parse(stored) : null;
    if (!user) {
      alert('You must be logged in.');
      window.location.href = 'reward-login.html';
    }

    const submitBtn = document.getElementById("submitBtn");
    const spinner = document.getElementById("spinner");
    const captionInput = document.getElementById("captionInput");
    const successMsg = document.getElementById("successMsg");
    const memeImage = document.getElementById("memeImage");
    const archiveNotice = document.getElementById("archiveNotice");

    let latestMemeId = null;
    let isArchived = false;

    // ✅ Load the latest meme
    async function loadMeme() {
      try {
        const res = await fetch(`${API_BASE_URL}/api/memes/latest`);
        if (!res.ok) throw new Error('No meme found.');
        const meme = await res.json();

        if (meme && meme.imageUrl) {
          memeImage.src = meme.imageUrl;
          latestMemeId = meme._id || meme.id || null;
          isArchived = meme.isArchived || false;

          if (isArchived) {
            archiveNotice.style.display = "block";
            submitBtn.disabled = true;
            captionInput.disabled = true;
          }
        }
      } catch (err) {
        console.error('Error loading meme:', err);
      }
    }

    loadMeme();

    // ✅ Caption submission
    submitBtn.addEventListener('click', async () => {
      const caption = captionInput.value.trim();
      const meme = memeImage.src;

      if (!caption) {
        alert("Please enter a caption before submitting.");
        return;
      }

      spinner.style.display = "block";
      submitBtn.disabled = true;

      try {
        const username = user.username || user.fullName || user.email;
        const profilePicture = user.profilePicture || null;
        const userId = user.id || user._id || null;

        // Check duplicate
        const checkRes = await fetch(`${API_BASE_URL}/api/captions/check?username=${encodeURIComponent(username)}&meme=${encodeURIComponent(meme)}&caption=${encodeURIComponent(caption)}`);
        const checkData = await checkRes.json();
        if (checkRes.ok && checkData.exists) {
          alert("You've already submitted a caption for this meme.");
          spinner.style.display = "none";
          submitBtn.disabled = false;
          return;
        }

        // Submit new caption
        const response = await fetch(`${API_BASE_URL}/api/captions`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            meme,
            memeId: latestMemeId,
            username,
            userId,
            profilePicture,
            caption
          })
        });

        const result = await response.json();
        spinner.style.display = "none";
        submitBtn.disabled = false;

        if (response.ok) {
          successMsg.textContent = "✅ Caption submitted successfully!";
          captionInput.value = "";
          // ✅ Redirect to captions page
          setTimeout(() => {
            window.location.href = "captions.html";
          }, 1500);
        } else {
          alert(result.message || "Submission failed.");
        }
      } catch (err) {
        console.error(err);
        alert("Error submitting caption.");
        spinner.style.display = "none";
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
