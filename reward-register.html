<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register - Contesto</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom right, #003366, #005f99);
      min-height: 100vh;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .form-box {
      width: 100%;
      min-height: 80vh;
      background: rgba(255, 255, 255, 0.05);
      padding: 40px 20px;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 20px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.4);
      border-radius: 10px;
    }

    .logo-section {
      text-align: center;
    }

    .logo {
      width: 90px;
      height: auto;
    }

    .form-title {
      text-align: center;
      font-size: 32px;
      color: #ff4757;
    }

    form {
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      height: 100%;
    }

    .input-group {
      width: 100%;
    }

    .input-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      font-size: 20px;
    }

    .input-group input {
      width: 100%;
      padding: 16px;
      font-size: 24px;
      border-radius: 8px;
      border: none;
      outline: none;
      background-color: rgba(255, 255, 255, 0.1);
      color: white;
    }

    #togglePassword {
      display: block;
      text-align: right;
      font-size: 12px;
      margin-top: 5px;
      color: #ffd700;
      cursor: pointer;
    }

    button {
      width: 100%;
      padding: 16px;
      background-color: #00aaff;
      border: none;
      color: white;
      font-size: 23px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #008ecc;
    }

    .message {
      margin-top: 10px;
      font-size: 18px;
      text-align: center;
    }

    .error {
      color: #ff6b6b;
    }

    .success {
      color: #32ff7e;
    }

    /* Loader Overlay */
    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      display: none;
    }

    .spinner {
      border: 8px solid rgba(255, 255, 255, 0.2);
      border-top: 8px solid #00aaff;
      border-radius: 50%;
      width: 70px;
      height: 70px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="form-box">
    <div class="logo-section">
      <img src="uploads/logo.png" alt="Site Logo" class="logo">
    </div>

    <h2 class="form-title">Create an Account</h2>

    <form id="registerForm">
      <div class="input-group">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullName" required>
      </div>

      <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" required>
      </div>

      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>

      <div class="input-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" required>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" required>
      </div>

      <div class="input-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" required>
        <small id="togglePassword">Show Password</small>
      </div>

      <button type="submit">Register</button>
      <p class="message" id="msg"></p>
    </form>
  </div>

  <!-- Loader Overlay -->
  <div class="overlay" id="overlay">
    <div class="spinner"></div>
  </div>

  <script>
    const toggle = document.getElementById('togglePassword');
    const password = document.getElementById('password');
    const confirmPassword = document.getElementById('confirmPassword');
    const form = document.getElementById('registerForm');
    const msg = document.getElementById('msg');
    const overlay = document.getElementById('overlay');

    toggle.addEventListener('click', () => {
      const isHidden = password.type === 'password';
      password.type = confirmPassword.type = isHidden ? 'text' : 'password';
      toggle.textContent = isHidden ? 'Hide Password' : 'Show Password';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      overlay.style.display = 'flex'; // Show overlay when submitting

      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const username = document.getElementById('username').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const pwd = password.value.trim();
      const confirmPwd = confirmPassword.value.trim();

      msg.textContent = '';
      msg.className = 'message';

      if (pwd !== confirmPwd) {
        overlay.style.display = 'none';
        msg.textContent = 'Passwords do not match!';
        msg.classList.add('error');
        return;
      }

      try {
        const checkRes = await fetch(`https://contesto.onrender.com/api/users/check-username?username=${username}`);
        const checkData = await checkRes.json();

        if (checkRes.ok && checkData.exists) {
          overlay.style.display = 'none';
          msg.textContent = `Username already exists! Try: ${username}${Math.floor(Math.random() * 1000)}`;
          msg.classList.add('error');
          return;
        }

        const res = await fetch('https://contesto.onrender.com/api/users/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fullName, email, username, phone, password: pwd }),
        });

        const data = await res.json();
        overlay.style.display = 'none';

        if (res.ok) {
  localStorage.setItem("userId", data.userId); // save temporary user ID
  window.location.href = "set-profile.html";
    }
        } else {
          msg.textContent = data.message || 'Registration failed.';
          msg.classList.add('error');
        }
      } catch (error) {
        overlay.style.display = 'none';
        msg.textContent = 'An error occurred. Please try again.';
        msg.classList.add('error');
        console.error(error);
      }
    });
  </script>
</body>
  </html>
